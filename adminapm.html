  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Prompt', sans-serif;
      background: linear-gradient(150deg, #ecfdf5 0%, #d1fae5 50%, #a7f3d0 100%);
      min-height: 100vh;
      padding: 1.25rem;
      background-attachment: fixed;
    }
    .page-header {
      background: linear-gradient(120deg, #065f46, #059669 55%, #10b981);
      border-radius: 20px;
      padding: 1.4rem 1.5rem;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 1rem;
      box-shadow: 0 12px 30px rgba(5, 150, 105, 0.3);
      max-width: 760px;
      margin: 0 auto 1.25rem;
    }
    .page-header .icon-box {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: rgba(255,255,255,0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      flex-shrink: 0;
    }
    .page-header h1 {
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.4;
    }
    .page-header p {
      font-size: 0.78rem;
      color: #d1fae5;
      font-weight: 400;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
      background: #ffffff;
      padding: 1.5rem;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(2, 44, 34, 0.12);
      position: relative;
      display: none; /* Hidden by default until authenticated */
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
      background: #f1f5f4;
      padding: 0.35rem;
      border-radius: 14px;
    }
    .tab {
      flex: 1;
      text-align: center;
      padding: 0.6rem 0.4rem;
      cursor: pointer;
      border-radius: 11px;
      font-weight: 600;
      font-size: 0.88rem;
      color: #4b5563;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      white-space: nowrap;
    }
    .tab i { font-size: 0.95rem; }
    .tab:hover { background: #e5f5ec; color: #047857; }
    .tab.active {
      background: linear-gradient(120deg, #059669, #10b981);
      color: #fff;
      box-shadow: 0 6px 16px rgba(5, 150, 105, 0.35);
    }
    .tab .count-badge {
      background: rgba(255,255,255,0.25);
      color: #fff;
      border-radius: 999px;
      font-size: 0.7rem;
      padding: 0.05rem 0.5rem;
      min-width: 1.4rem;
    }
    .tab:not(.active) .count-badge {
      background: #d1fae5;
      color: #047857;
    }
    .tab-content { display: none; animation: fadeIn 0.3s ease; }
    .tab-content.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    .section-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: #065f46;
      margin-bottom: 0.6rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .form-group {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    input[type="text"] {
      flex: 1;
      padding: 0.7rem 0.9rem;
      border: 1.5px solid #d1d5db;
      border-radius: 12px;
      outline: none;
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
      font-size: 0.9rem;
      font-family: 'Prompt', sans-serif;
      min-width: 0;
    }
    input[type="text"]:focus {
      border-color: #10b981;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.18);
    }
    .search-wrap {
      position: relative;
      margin-bottom: 1rem;
    }
    .search-wrap i {
      position: absolute;
      left: 0.9rem;
      top: 50%;
      transform: translateY(-50%);
      color: #9ca3af;
      font-size: 0.85rem;
    }
    .search-wrap input { padding-left: 2.3rem; }

    .btn {
      padding: 0.7rem 1.3rem;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      font-family: 'Prompt', sans-serif;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      transition: all 0.25s ease;
      color: #fff;
      background: linear-gradient(120deg, #059669, #10b981);
      box-shadow: 0 6px 16px rgba(5, 150, 105, 0.28);
      white-space: nowrap;
    }
    .btn:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(5, 150, 105, 0.4); }
    .btn:active { transform: translateY(0); }

    .table-scroll { overflow-x: auto; }
    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      margin-bottom: 1rem;
      font-size: 0.88rem;
    }
    th, td {
      padding: 0.7rem 0.8rem;
      border-bottom: 1px solid #eef2ef;
      text-align: left;
    }
    th {
      background: #f0fdf4;
      color: #065f46;
      font-weight: 600;
      font-size: 0.8rem;
      letter-spacing: 0.3px;
    }
    th:first-child { border-radius: 10px 0 0 0; }
    th:last-child { border-radius: 0 10px 0 0; }
    tbody tr { transition: background 0.2s ease; }
    tbody tr:hover { background: #f0fdf4; }
    tbody tr:last-child td { border-bottom: none; }

    td .button-group {
      display: flex;
      gap: 0.4rem;
      justify-content: flex-end;
    }
    td button {
      padding: 0.45rem 0.9rem;
      font-size: 0.78rem;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-family: 'Prompt', sans-serif;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      transition: all 0.2s ease;
      color: #fff;
    }
    .edit-btn { background: #0ea5e9; }
    .edit-btn:hover { background: #0284c7; }
    .delete-btn { background: #ef4444; }
    .delete-btn:hover { background: #dc2626; }

    .empty-row td {
      text-align: center;
      color: #9ca3af;
      padding: 2rem 0.5rem;
      font-size: 0.9rem;
    }
    .empty-row i { font-size: 1.6rem; display: block; margin-bottom: 0.4rem; opacity: 0.5; }

    /* Loading overlay */
    .loading-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(3px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      gap: 1.1rem;
    }
    .spinner {
      width: 44px; height: 44px;
      border: 4px solid #d1fae5;
      border-top: 4px solid #059669;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    .loading-text {
      font-size: 1rem;
      font-weight: 600;
      color: #047857;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 640px) {
      body { padding: 0.9rem; }
      .container { padding: 1rem; }
      .page-header { padding: 1.1rem 1rem; }
      .tabs { gap: 0.25rem; padding: 0.3rem; }
      .tab { font-size: 0.78rem; padding: 0.55rem 0.2rem; }
      .form-group { flex-direction: column; }
      .btn { width: 100%; }
      td .button-group { justify-content: flex-start; }
      th { font-size: 0.72rem; }
    }
  </style>

<body>
  <div class="page-header">
    <div class="icon-box"><i class="fas fa-leaf"></i></div>
    <div>
      <h1>จัดการข้อมูล ส่งเสริม, Collector และ ชุปเปอร์ไวเซอร์</h1>
      <p>ระบบจัดการข้อมูลผู้ใช้งาน ส่งเสริมการเกษตร</p>
    </div>
  </div>

  <div class="container" id="mainContainer">
    <div class="loading-overlay" id="loadingOverlay">
      <div class="spinner"></div>
      <p class="loading-text">กำลังบันทึก..</p>
    </div>

    <div class="tabs">
      <div class="tab active" data-tab="promoter"><i class="fas fa-user-tie"></i> ส่งเสริม <span class="count-badge" id="badge-promoter">0</span></div>
      <div class="tab" data-tab="collector"><i class="fas fa-truck"></i> Collector <span class="count-badge" id="badge-collector">0</span></div>
      <div class="tab" data-tab="supervisor"><i class="fas fa-user-shield"></i> ชุปเปอร์ไวเซอร์ <span class="count-badge" id="badge-supervisor">0</span></div>
    </div>

    <!-- Promoter Tab -->
    <div class="tab-content active" id="promoter">
      <p class="section-title"><i class="fas fa-plus-circle"></i> เพิ่มชื่อส่งเสริม</p>
      <div class="form-group">
        <input type="text" id="promoterName" placeholder="ชื่อส่งเสริม">
        <button class="btn" onclick="addData('promoter')"><i class="fas fa-plus"></i> เพิ่ม</button>
      </div>
      <div class="search-wrap">
        <i class="fas fa-search"></i>
        <input type="text" id="searchPromoter" placeholder="ค้นหาส่งเสริม..." onkeyup="searchTable('promoter')" class="search-input">
      </div>
      <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th>ชื่อ</th>
            <th style="text-align:right;">แก้ไข / ลบ</th>
          </tr>
        </thead>
        <tbody id="promoterTable"></tbody>
      </table>
      </div>
    </div>

    <!-- Collector Tab -->
    <div class="tab-content" id="collector">
      <p class="section-title"><i class="fas fa-plus-circle"></i> เพิ่มชื่อ Collector</p>
      <div class="form-group">
        <input type="text" id="collectorName" placeholder="ชื่อ Collector">
        <button class="btn" onclick="addData('collector')"><i class="fas fa-plus"></i> เพิ่ม</button>
      </div>
      <div class="search-wrap">
        <i class="fas fa-search"></i>
        <input type="text" id="searchCollector" placeholder="ค้นหา Collector..." onkeyup="searchTable('collector')" class="search-input">
      </div>
      <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th>ชื่อ</th>
            <th style="text-align:right;">แก้ไข / ลบ</th>
          </tr>
        </thead>
        <tbody id="collectorTable"></tbody>
      </table>
      </div>
    </div>

    <!-- Supervisor Tab -->
    <div class="tab-content" id="supervisor">
      <p class="section-title"><i class="fas fa-plus-circle"></i> เพิ่มชื่อชุปเปอร์ไวเซอร์</p>
      <div class="form-group">
        <input type="text" id="supervisorName" placeholder="ชื่อชุปเปอร์ไวเซอร์">
        <button class="btn" onclick="addData('supervisor')"><i class="fas fa-plus"></i> เพิ่ม</button>
      </div>
      <div class="search-wrap">
        <i class="fas fa-search"></i>
        <input type="text" id="searchSupervisor" placeholder="ค้นหาชุปเปอร์ไวเซอร์..." onkeyup="searchTable('supervisor')" class="search-input">
      </div>
      <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th>ชื่อ</th>
            <th style="text-align:right;">แก้ไข / ลบ</th>
          </tr>
        </thead>
        <tbody id="supervisorTable"></tbody>
      </table>
      </div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwJ6CKgir6gaKJGRs5_IU8HVaqJ91FfZCbuE0ZO4CNr73H47gDrK0bV0KCMpvtrD6s/exec";
    const PASSWORD = "admin"; // Hardcoded password

    // Cache of loaded names so we can render tab counts & tables safely
    const dataCache = { promoter: [], collector: [], supervisor: [] };
    const TYPE_MAP = { promoter: 'Promoter', collector: 'Collector', supervisor: 'Supervisor' };

    const actionFor = (type, verb) => verb + TYPE_MAP[type];

    // ดึง JSON จาก GAS แบบทนทาน: กัน timeout / คำตอบ HTML / คำตอบว่าง + ลองใหม่แบบ backoff
    // (GAS มีข้อจำกัดเรื่อง concurrent executions ถ้าเรียกพร้อมกันหลายครั้งจะโหลดมาไม่ครบ)
    const RETRYABLE_STATUS = new Set([408, 429, 500, 502, 503, 504]);
    async function requestJson(url, options, retries = 2) {
      let lastError = null;
      for (let attempt = 0; attempt <= retries; attempt++) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 30000);
        let retryable = false;
        try {
          const response = await fetch(url, { ...options, signal: controller.signal });
          clearTimeout(timer);
          if (!response.ok) {
            retryable = RETRYABLE_STATUS.has(response.status);
            throw new Error('HTTP ' + response.status);
          }
          const text = await response.text();
          const trimmed = text.trim();
          if (!trimmed) throw new Error('API ตอบกลับว่างเปล่า');
          // GAS บางครั้งตอบหน้า HTML (ต้องล็อกอิน / ยังไม่เปิดสาธารณะ) → ถือว่าล้มเหลวทันที
          if (trimmed.charAt(0) === '<') throw new Error('API ตอบกลับเป็นหน้า HTML (ยังไม่เปิดใช้งานสาธารณะ)');
          return JSON.parse(trimmed);
        } catch (err) {
          clearTimeout(timer);
          if (err && err.name === 'AbortError') {
            lastError = new Error('API ตอบช้าเกินไป (หมดเวลา 30 วินาที)');
            retryable = true;
          } else {
            lastError = err;
          }
          if (retryable && attempt < retries) {
            await new Promise(res => setTimeout(res, 1000 * (attempt + 1))); // รอแล้วลองใหม่
          }
        }
      }
      throw lastError;
    }
    const showLoading = (show) => {
      const el = document.getElementById('loadingOverlay');
      el.style.display = show ? 'flex' : 'none';
      document.body.style.overflow = show ? 'hidden' : '';
    };
    const showError = (msg) => Swal.fire({ icon: 'error', title: 'ข้อผิดพลาด', text: msg, confirmButtonColor: '#059669' });
    const showSuccess = (msg) => Swal.fire({ icon: 'success', title: 'สำเร็จ', text: msg, timer: 1500, showConfirmButton: false, confirmButtonColor: '#059669' });

    // Password prompt on page load
    window.onload = function () {
      Swal.fire({
        title: 'กรุณาใส่รหัสผ่าน',
        input: 'password',
        inputPlaceholder: 'รหัสผ่าน',
        showCancelButton: false,
        allowOutsideClick: false,
        allowEscapeKey: false,
        confirmButtonText: 'เข้าสู่ระบบ',
        confirmButtonColor: '#059669',
        inputValidator: (value) => {
          if (!value) return 'กรุณากรอกรหัสผ่าน!';
          if (value !== PASSWORD) return 'รหัสผ่านไม่ถูกต้อง!';
        }
      }).then((result) => {
        if (result.isConfirmed && result.value === PASSWORD) {
          document.getElementById('mainContainer').style.display = 'block';
          loadAllData();
        }
      });
    };

    // โหลดทีละรายการ ตามลำดับ (ไม่ยิง GAS พร้อมกัน 3 ครั้ง)
    // → กัน GAS จำกัด concurrent executions / cold start จนโหลดมาไม่ครบ
    async function loadAllData() {
      const loadingText = document.querySelector('#loadingOverlay .loading-text');
      const originalText = loadingText.textContent;
      loadingText.textContent = 'กำลังโหลดข้อมูล...';
      showLoading(true);
      const failures = [];
      try {
        await loadData('promoter', failures);
        await loadData('collector', failures);
        await loadData('supervisor', failures);
      } finally {
        loadingText.textContent = originalText;
        showLoading(false);
      }
      // รวมข้อผิดพลาดทั้งหมดในกล่องเดียว (กัน Swal หลายกล่องซ้อนกัน)
      if (failures.length) {
        Swal.fire({
          icon: 'error',
          title: 'โหลดข้อมูลไม่ครบ',
          html: 'ไม่สามารถโหลดข้อมูลบางรายการได้:<br>' + failures.map(f => '• ' + f).join('<br>'),
          confirmButtonColor: '#059669',
          showCancelButton: true,
          confirmButtonText: 'ลองใหม่',
          cancelButtonText: 'ปิด'
        }).then(result => {
          if (result.isConfirmed) loadAllData();
        });
      }
    }

    // Tab switching
    $('.tab').on('click', function () {
      $('.tab').removeClass('active');
      $('.tab-content').removeClass('active');
      $(this).addClass('active');
      $(`#${$(this).data('tab')}`).addClass('active');
    });

    // Load data for tables (ทนทาน: timeout + ลองใหม่หลายครั้ง จนกว่าจะได้ข้อมูลครบ)
    // ถ้าส่ง failures เข้ามาจะเก็บข้อผิดพลาดไว้ (โหลดตอนเปิดหน้า) แทนการเด้งกล่องแจ้งเตือนทีละอัน
    async function loadData(type, failures) {
      try {
        const data = await requestJson(`${SCRIPT_URL}?action=get${TYPE_MAP[type]}Names`, {}, 3);
        if (data.error) throw new Error(data.error);
        dataCache[type] = Array.isArray(data) ? data : [];
        renderTable(type);
        return true;
      } catch (error) {
        if (failures) {
          failures.push(error.message);
        } else {
          showError('เกิดข้อผิดพลาดในการโหลดข้อมูล: ' + error.message);
        }
        return false;
      }
    }

    // Render table safely (textContent = no HTML injection / broken rows from quotes)
    function renderTable(type) {
      const names = dataCache[type];
      const tbody = document.getElementById(`${type}Table`);
      tbody.innerHTML = '';
      document.getElementById(`badge-${type}`).textContent = names.length;

      if (!names.length) {
        const tr = document.createElement('tr');
        tr.className = 'empty-row';
        const td = document.createElement('td');
        td.colSpan = 2;
        td.innerHTML = '<i class="fas fa-inbox"></i>ยังไม่มีข้อมูล';
        tr.appendChild(td);
        tbody.appendChild(tr);
        return;
      }

      names.forEach((name, index) => {
        const tr = document.createElement('tr');
        tr.dataset.row = index + 2; // spreadsheet row number

        const tdName = document.createElement('td');
        tdName.textContent = name;

        const tdActions = document.createElement('td');
        const group = document.createElement('div');
        group.className = 'button-group';

        const editBtn = document.createElement('button');
        editBtn.className = 'edit-btn';
        editBtn.innerHTML = '<i class="fas fa-edit"></i> แก้ไข';
        editBtn.onclick = () => editData(type, editBtn);

        const delBtn = document.createElement('button');
        delBtn.className = 'delete-btn';
        delBtn.innerHTML = '<i class="fas fa-trash"></i> ลบ';
        delBtn.onclick = () => deleteData(type, delBtn);

        group.appendChild(editBtn);
        group.appendChild(delBtn);
        tdActions.appendChild(group);
        tr.appendChild(tdName);
        tr.appendChild(tdActions);
        tbody.appendChild(tr);
      });
    }

    // Add new data
    function addData(type) {
      const input = document.getElementById(`${type}Name`);
      const name = input.value.trim();
      if (!name) {
        Swal.fire({ icon: 'warning', title: 'กรุณากรอกชื่อ', text: 'ต้องกรอกชื่อก่อนเพิ่มข้อมูล', confirmButtonColor: '#059669' });
        return;
      }

      showLoading(true);
      requestJson(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({ action: actionFor(type, 'add'), name: name })
      }, 0)
      .then(result => {
        showLoading(false);
        if (result.status === 'success') {
          showSuccess('เพิ่มข้อมูลเรียบร้อย');
          input.value = '';
          loadData(type);
        } else {
          showError(result.message || 'เพิ่มข้อมูลไม่สำเร็จ');
        }
      })
      .catch(error => {
        showLoading(false);
        showError('เกิดข้อผิดพลาดในการเพิ่มข้อมูล: ' + error.message);
      });
    }

    // Edit existing data (name is read from the row, not embedded in HTML strings)
    function editData(type, btn) {
      const tr = btn.closest('tr');
      const row = parseInt(tr.dataset.row, 10);
      const oldName = tr.querySelector('td').textContent;

      Swal.fire({
        title: 'แก้ไขชื่อ',
        input: 'text',
        inputValue: oldName,
        showCancelButton: true,
        confirmButtonText: 'บันทึก',
        cancelButtonText: 'ยกเลิก',
        confirmButtonColor: '#059669',
        cancelButtonColor: '#9ca3af'
      }).then(result => {
        const newName = result.value ? result.value.trim() : '';
        if (result.isConfirmed && newName) {
          showLoading(true);
          requestJson(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify({ action: actionFor(type, 'edit'), row: row, name: newName })
          }, 0)
          .then(result => {
            showLoading(false);
            if (result.status === 'success') {
              showSuccess('แก้ไขข้อมูลเรียบร้อย');
              loadData(type);
            } else {
              showError(result.message || 'แก้ไขข้อมูลไม่สำเร็จ');
            }
          })
          .catch(error => {
            showLoading(false);
            showError('เกิดข้อผิดพลาดในการแก้ไข: ' + error.message);
          });
        } else if (result.isConfirmed && !newName) {
          Swal.fire({ icon: 'warning', title: 'ชื่อต้องไม่ว่าง', confirmButtonColor: '#059669' });
        }
      });
    }

    // Delete data
    function deleteData(type, btn) {
      const tr = btn.closest('tr');
      const row = parseInt(tr.dataset.row, 10);

      Swal.fire({
        title: 'แน่ใจหรือไม่?',
        text: 'คุณต้องการลบข้อมูลนี้หรือไม่?',
        icon: 'warning',
        showCancelButton: true,
        confirmButtonText: 'ลบ',
        cancelButtonText: 'ยกเลิก',
        confirmButtonColor: '#dc2626',
        cancelButtonColor: '#9ca3af'
      }).then(result => {
        if (result.isConfirmed) {
          showLoading(true);
          requestJson(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify({ action: actionFor(type, 'delete'), row: row })
          }, 0)
          .then(result => {
            showLoading(false);
            if (result.status === 'success') {
              showSuccess('ลบข้อมูลเรียบร้อย');
              loadData(type);
            } else {
              showError(result.message || 'ลบข้อมูลไม่สำเร็จ');
            }
          })
          .catch(error => {
            showLoading(false);
            showError('เกิดข้อผิดพลาดในการลบ: ' + error.message);
          });
        }
      });
    }

    // Search table data
    function searchTable(type) {
      const input = document.getElementById(`search${type.charAt(0).toUpperCase() + type.slice(1)}`);
      const filter = input.value.toLowerCase();
      const table = document.getElementById(`${type}Table`);
      const rows = table.getElementsByTagName('tr');

      for (let i = 0; i < rows.length; i++) {
        const cells = rows[i].getElementsByTagName('td');
        if (cells.length > 0) {
          const nameCell = cells[0];
          if (nameCell) {
            const txtValue = nameCell.textContent || nameCell.innerText;
            rows[i].style.display = txtValue.toLowerCase().indexOf(filter) > -1 ? '' : 'none';
          }
        }
      }
    }
  </script>
</body>
</html>
