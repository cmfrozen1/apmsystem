    <style>
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;

        .glass-effect {

        .mobile-gradient {
            background: linear-gradient(135deg, #10b981 0%, #047857 100%);
        }
        
        .tab-indicator {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .loading-dots {
            animation: loading 1.4s ease-in-out infinite both;
        }
        
        .loading-dots:nth-child(1) { animation-delay: -0.32s; }
        .loading-dots:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes loading {
            0%, 80%, 100% {
                transform: scale(0);
                opacity: 0.5;
            }
            40% {
                transform: scale(1);
                opacity: 1;
            }
        }
        
        .tab-button {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .tab-button:active {
            transform: scale(0.95);

            background: linear-gradient(to bottom, #047857, #065f46);

        /* Go to top button */
        .go-to-top {
            position: fixed;
            bottom: 90px;
            right: 20px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #10b981 0%, #047857 100%);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
            cursor: pointer;
            opacity: 0;
            visibility: hidden;
            transform: translateY(20px);
            transition: all 0.3s ease;
            z-index: 1000;
        }
        
        .go-to-top.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }
        
        .go-to-top:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.6);
        }
        
        /* Footer styles */
        .footer-gradient {
            background: linear-gradient(135deg, #10b981 0%, #047857 100%);
        }
        
        .footer-content {
            animation: slideUp 0.5s ease-out;
        }
        
        /* For Firefox */

    <script>
        let currentTab = 'supervisor';

        // จัดการการโหลด iframe แรก
        document.addEventListener('DOMContentLoaded', function() {
            const supervisorIframe = document.getElementById('supervisor-iframe');
            const supervisorLoading = document.getElementById('supervisor-loading');
            
            supervisorIframe.addEventListener('load', function() {
                setTimeout(() => {
                    supervisorLoading.classList.add('hidden');
                    supervisorIframe.classList.remove('hidden');
                }, 1000);
            });

            // Initialize scroll event listener
            initScrollTopButton();
        });

        function switchTab(tab) {
            if (currentTab === tab) return;
            
            const supervisorContent = document.getElementById('supervisor-content');
            const promoterContent = document.getElementById('promoter-content');
            const supervisorBtn = document.getElementById('supervisor-btn');
            const promoterBtn = document.getElementById('promoter-btn');
            
            if (tab === 'supervisor') {
                // Switch to supervisor
                supervisorContent.style.transform = 'translateX(0)';
                promoterContent.style.transform = 'translateX(100%)';
                
                // Update supervisor button (active state)
                const supervisorIcon = supervisorBtn.querySelector('.w-8.h-8');
                const supervisorText = supervisorBtn.querySelector('span');
                const supervisorIndicator = supervisorBtn.querySelector('.w-8.h-1');
                
                supervisorIcon.className = 'w-8 h-8 rounded-2xl bg-gradient-to-r from-emerald-500 to-teal-600 flex items-center justify-center shadow-lg group-hover:shadow-xl transition-all duration-300';
                supervisorText.className = 'text-sm font-semibold text-emerald-600';
                supervisorIndicator.className = 'w-8 h-1 bg-emerald-500 rounded-full mt-1 opacity-100';
                
                // Update promoter button (inactive state)
                const promoterIcon = promoterBtn.querySelector('.w-8.h-8');
                const promoterText = promoterBtn.querySelector('span');
                const promoterIndicator = promoterBtn.querySelector('.w-8.h-1');
                
                promoterIcon.className = 'w-8 h-8 rounded-2xl bg-gray-200 flex items-center justify-center transition-all duration-300 group-hover:bg-emerald-100';
                promoterText.className = 'text-sm font-medium text-gray-500 group-hover:text-emerald-500 transition-colors duration-300';
                promoterIndicator.className = 'w-8 h-1 bg-transparent rounded-full mt-1';
                
            } else {
                // Switch to promoter
                supervisorContent.style.transform = 'translateX(-100%)';
                promoterContent.style.transform = 'translateX(0)';
                
                // Update promoter button (active state)
                const promoterIcon = promoterBtn.querySelector('.w-8.h-8');
                const promoterText = promoterBtn.querySelector('span');
                const promoterIndicator = promoterBtn.querySelector('.w-8.h-1');
                
                promoterIcon.className = 'w-8 h-8 rounded-2xl bg-gradient-to-r from-lime-400 to-emerald-500 flex items-center justify-center shadow-lg group-hover:shadow-xl transition-all duration-300';
                promoterText.className = 'text-sm font-semibold text-lime-600';
                promoterIndicator.className = 'w-8 h-1 bg-lime-500 rounded-full mt-1 opacity-100';
                
                // Update supervisor button (inactive state)
                const supervisorIcon = supervisorBtn.querySelector('.w-8.h-8');
                const supervisorText = supervisorBtn.querySelector('span');
                const supervisorIndicator = supervisorBtn.querySelector('.w-8.h-1');
                
                supervisorIcon.className = 'w-8 h-8 rounded-2xl bg-gray-200 flex items-center justify-center transition-all duration-300 group-hover:bg-teal-100';
                supervisorText.className = 'text-sm font-medium text-gray-500 group-hover:text-teal-500 transition-colors duration-300';
                supervisorIndicator.className = 'w-8 h-1 bg-transparent rounded-full mt-1';
                
                // Load promoter iframe if not loaded
                const promoterIframe = document.getElementById('promoter-iframe');
                const promoterLoading = document.getElementById('promoter-loading');
                
                if (!promoterIframe.src) {
                    promoterLoading.classList.remove('hidden');
                    promoterIframe.src = 'https://script.google.com/macros/s/AKfycbyM1BUQOxd6XS_SsxKyEnQ-8MOaQUp7tkOn11qchlDvEDcw7oC0VwjxEl_DAAzQg1J11A/exec';
                    
                    promoterIframe.addEventListener('load', function() {
                        setTimeout(() => {
                            promoterLoading.classList.add('hidden');
                            promoterIframe.classList.remove('hidden');
                        }, 1000);
                    }, { once: true });
                }
            }
            
            currentTab = tab;
        }

        // Add touch/swipe support for mobile
        let startX = 0;
        let currentX = 0;
        let isDragging = false;

        document.addEventListener('touchstart', function(e) {
            startX = e.touches[0].clientX;
            isDragging = true;
        }, { passive: true });

        document.addEventListener('touchmove', function(e) {
            if (!isDragging) return;
            currentX = e.touches[0].clientX;
        }, { passive: true });

        document.addEventListener('touchend', function(e) {
            if (!isDragging) return;
            isDragging = false;
            
            const diffX = startX - currentX;
            
            if (Math.abs(diffX) > 80) { // Increased swipe threshold
                if (diffX > 0 && currentTab === 'supervisor') {
                    // Swipe left to promoter
                    switchTab('promoter');
                } else if (diffX < 0 && currentTab === 'promoter') {
                    // Swipe right to supervisor
                    switchTab('supervisor');
                }
            }
        }, { passive: true });

        // Add haptic feedback for mobile (if supported)
        function hapticFeedback() {
            if ('vibrate' in navigator) {
                navigator.vibrate(10); // Very short vibration
            }
        }

        // Add haptic to tab buttons
        document.getElementById('supervisor-btn').addEventListener('click', hapticFeedback);
        document.getElementById('promoter-btn').addEventListener('click', hapticFeedback);

        // Prevent zooming
        document.addEventListener('gesturestart', function(e) {
            e.preventDefault();
        });

        document.addEventListener('gesturechange', function(e) {
            e.preventDefault();
        });

        document.addEventListener('gestureend', function(e) {
            e.preventDefault();
        });

        // Go to top functionality
        function initScrollTopButton() {
            const goToTopButton = document.getElementById('go-to-top');
            
            // Show/hide button based on scroll position
            window.addEventListener('scroll', function() {
                if (window.pageYOffset > 300) {
                    goToTopButton.classList.add('show');
                } else {
                    goToTopButton.classList.remove('show');
                }
            });
            
            // Scroll to top when button is clicked
            goToTopButton.addEventListener('click', function() {
                window.scrollTo({
                    top: 0,
                    behavior: 'smooth'
                });
            });
            
            // Also handle iframe scrolling
            const iframes = document.querySelectorAll('iframe');
            iframes.forEach(iframe => {
                iframe.addEventListener('load', function() {
                    try {
                        const iframeWindow = iframe.contentWindow;
                        iframeWindow.addEventListener('scroll', function() {
                            if (iframeWindow.pageYOffset > 300) {
                                goToTopButton.classList.add('show');
                            } else {
                                goToTopButton.classList.remove('show');
                            }
                        });
                        
                        // Handle click to scroll iframe to top
                        const originalOnClick = goToTopButton.onclick;
                        goToTopButton.onclick = function() {
                            iframeWindow.scrollTo({
                                top: 0,
                                behavior: 'smooth'
                            });
                            if (originalOnClick) originalOnClick();
                        };
                    } catch (e) {
                        console.log('Cannot access iframe content due to cross-origin policy');
                    }
                });
            });
        }
    </script>
</body>
</html>
