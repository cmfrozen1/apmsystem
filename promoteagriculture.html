<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ส่งงานส่งเสริมการเกษตร</title>
  <meta name="description" content="แบบฟอร์มส่งงานส่งเสริมการเกษตร">
  <link rel="icon" type="image/png" sizes="96x96"
    href="https://lh3.googleusercontent.com/a/ACg8ocJt_yMM3sBNowu7Y5BiDgl5qQ9R1vTL5vokSt_XWwuqA8_m7QU=s288-c-no">
  <!-- Preconnect to speed up CDN connections -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://lh3.googleusercontent.com">
  <link rel="dns-prefetch" href="https://static.line-scdn.net">
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/css/tom-select.min.css" rel="stylesheet" />
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/js/tom-select.complete.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11" defer></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Prompt', sans-serif;
      background: linear-gradient(155deg, #f0fdf4 0%, #ecfdf5 45%, #d1fae5 100%);
      min-height: 100vh;
      padding-bottom: 3rem;
      background-attachment: fixed;
    }

    /* Header */
    .app-header {
      background: linear-gradient(120deg, #065f46, #059669 55%, #10b981);
      color: #fff;
      padding: 1.3rem 1.2rem;
      display: flex;
      align-items: center;
      gap: 0.9rem;
      box-shadow: 0 8px 24px rgba(5, 150, 105, 0.28);
      position: sticky;
      top: 0;
      z-index: 500;
    }

    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #d1fae5;
      border: 2px solid rgba(255, 255, 255, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      font-weight: 700;
      color: #047857;
      overflow: hidden;
      flex-shrink: 0;
      position: relative;
    }

    /* รูปโปรไฟล์: ขยายเต็มกรอบวงกลมรวมขอบ (ไม่เหลือช่องว่างรอบรูป) */
    .avatar img {
      position: absolute;
      top: -2px;
      left: -2px;
      width: calc(100% + 4px);
      height: calc(100% + 4px);
      object-fit: cover;
    }

    .avatar.no-photo img {
      display: none;
    }

    .app-header .titles {
      flex: 1;
      min-width: 0;
    }

    .app-header .titles h1 {
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.35;
    }

    .app-header .titles p {
      font-size: 0.78rem;
      color: #d1fae5;
    }

    .leaf-badge {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.16);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      flex-shrink: 0;
    }

    .card {
      max-width: 540px;
      margin: 1.2rem auto 0;
      background: #fff;
      border-radius: 22px;
      box-shadow: 0 18px 44px rgba(2, 44, 34, 0.14);
      padding: 1.6rem 1.5rem 1.8rem;
      position: relative;
      border: 1px solid #eef2ef;
    }

    /* GPS checking screen */
    .gps-checking {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 3rem 1.2rem;
      min-height: 420px;
    }

    .gps-icon-wrap {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: linear-gradient(135deg, #d1fae5, #a7f3d0);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.6rem;
      box-shadow: 0 12px 30px rgba(5, 150, 105, 0.25);
      animation: gpsPulse 2.2s ease-in-out infinite;
    }

    .gps-icon-wrap i {
      font-size: 2.6rem;
      color: #047857;
    }

    @keyframes gpsPulse {

      0%,
      100% {
        transform: scale(1);
        box-shadow: 0 12px 30px rgba(5, 150, 105, 0.25);
      }

      50% {
        transform: scale(1.06);
        box-shadow: 0 14px 38px rgba(5, 150, 105, 0.4);
      }
    }

    .gps-checking h3 {
      font-size: 1.3rem;
      font-weight: 700;
      color: #064e3b;
      margin-bottom: 0.6rem;
    }

    .gps-checking p {
      color: #6b7280;
      font-size: 0.9rem;
      margin-bottom: 1.8rem;
    }

    .spinner {
      width: 42px;
      height: 42px;
      border: 4px solid #d1fae5;
      border-top: 4px solid #059669;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .hidden {
      display: none !important;
    }

    .section-head {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      font-weight: 600;
      color: #065f46;
      margin: 1.3rem 0 0.7rem;
      padding-bottom: 0.5rem;
      border-bottom: 2px solid #f0fdf4;
    }

    .section-head:first-of-type {
      margin-top: 0;
    }

    .section-head .icon {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      background: #d1fae5;
      color: #047857;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
    }

    .field {
      margin-bottom: 0.9rem;
    }

    .field label {
      display: block;
      font-size: 0.82rem;
      font-weight: 500;
      color: #4b5563;
      margin-bottom: 0.35rem;
    }

    .field label .req {
      color: #dc2626;
    }

    input[type="text"],
    input[type="date"],
    input[type="file"],
    textarea {
      width: 100%;
      padding: 0.72rem 0.9rem;
      border: 1.5px solid #d1d5db;
      border-radius: 12px;
      outline: none;
      font-family: 'Prompt', sans-serif;
      font-size: 0.9rem;
      background: #fff;
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
      color: #1f2937;
    }

    input:focus,
    textarea:focus {
      border-color: #10b981;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.18);
    }

    textarea {
      min-height: 96px;
      resize: vertical;
    }

    input[type="file"] {
      padding: 0.5rem 0.9rem;
    }

    /* ช่องวันที่: ให้พอดีกับเนื้อหา ไม่ยืดเต็มความกว้าง */
    input[type="date"] {
      width: auto;
      max-width: 220px;
      min-width: 0;
    }

    .file-box {
      border: 2px dashed #a7f3d0;
      border-radius: 14px;
      padding: 1.1rem;
      text-align: center;
      color: #047857;
      font-size: 0.85rem;
      background: #f0fdf4;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .file-box:hover {
      border-color: #059669;
      background: #ecfdf5;
    }

    .file-box i {
      font-size: 1.4rem;
      display: block;
      margin-bottom: 0.3rem;
    }

    .image-preview {
      margin-top: 0.8rem;
    }

    .image-preview img {
      width: 100%;
      max-height: 260px;
      object-fit: cover;
      border-radius: 14px;
      border: 2px solid #d1fae5;
      box-shadow: 0 8px 20px rgba(2, 44, 34, 0.12);
    }

    .img-size-note {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.75rem;
      color: #047857;
      background: #f0fdf4;
      padding: 0.45rem 0.8rem;
      border-radius: 10px;
      margin-top: 0.5rem;
      word-break: break-all;
    }

    .map-container iframe {
      border-radius: 14px;
      border: 2px solid #d1fae5;
    }

    .coords-note {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.75rem;
      color: #047857;
      background: #f0fdf4;
      padding: 0.45rem 0.8rem;
      border-radius: 10px;
      margin-top: 0.5rem;
      word-break: break-all;
    }

    .coords-note i {
      flex-shrink: 0;
    }

    .submit-btn {
      width: 100%;
      margin-top: 1.4rem;
      padding: 0.95rem 1rem;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      font-family: 'Prompt', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      color: #fff;
      background: linear-gradient(120deg, #059669, #10b981);
      box-shadow: 0 10px 26px rgba(5, 150, 105, 0.35);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.55rem;
      transition: all 0.25s ease;
    }

    .submit-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 14px 32px rgba(5, 150, 105, 0.45);
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Tom Select green styling */
    .ts-wrapper {
      width: 100% !important;
    }

    .ts-control {
      border: 1.5px solid #d1d5db !important;
      border-radius: 12px !important;
      background-color: #ffffff !important;
      padding: 0.6rem 1rem !important;
      font-size: 0.9rem !important;
      color: #374151 !important;
      min-height: 44px !important;
      font-family: 'Prompt', sans-serif !important;
      cursor: pointer;
    }

    .ts-wrapper.focus .ts-control {
      border-color: #10b981 !important;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.18) !important;
    }

    .ts-dropdown {
      border-radius: 12px !important;
      border: 1.5px solid #d1d5db !important;
      font-family: 'Prompt', sans-serif !important;
      font-size: 0.9rem !important;
    }

    .ts-dropdown .option {
      font-family: 'Prompt', sans-serif !important;
      padding: 0.5rem 1rem;
    }

    .ts-dropdown .option.active {
      background-color: #059669 !important;
      color: #fff !important;
    }

    /* Loading overlay */
    .loading-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(4px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 1.1rem;
    }

    .loader {
      width: 50px;
      height: 50px;
      border: 5px solid #d1fae5;
      border-top: 5px solid #059669;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    .loading-text {
      font-size: 1rem;
      font-weight: 600;
      color: #047857;
    }

    .footnote {
      text-align: center;
      font-size: 0.75rem;
      color: #9ca3af;
      margin-top: 1.4rem;
    }

    @media (max-width: 480px) {
      .card {
        margin: 0.9rem 0.8rem 0;
        padding: 1.3rem 1.1rem 1.5rem;
      }

      .app-header {
        padding: 1rem 0.9rem;
      }
    }
  </style>
</head>

<body>
  <!-- Header -->
  <header class="app-header">
    <div class="avatar" id="avatarBox"><img id="profileImage" src="" alt="Profile"><i class="fas fa-user"></i></div>
    <div class="titles">
      <h1>ส่งงานส่งเสริมการเกษตร</h1>
      <p id="displayName">กำลังโหลด...</p>
    </div>
    <div class="leaf-badge"><i class="fas fa-leaf"></i></div>
  </header>

  <div class="card">
    <div class="loading-overlay" id="loadingOverlay">
      <div class="loader"></div>
      <p class="loading-text">กำลังบันทึก..</p>
    </div>

    <!-- GPS Checking Screen -->
    <div id="gpsCheckingScreen" class="gps-checking">
      <div class="gps-icon-wrap"><i class="fas fa-map-marker-alt"></i></div>
      <h3>กำลังตรวจสอบ GPS</h3>
      <p>กรุณารอสักครู่ขณะที่เราตรวจสอบตำแหน่งของคุณ...</p>
      <div class="spinner"></div>
    </div>

    <!-- Main Form (Hidden until GPS ready) -->
    <form id="dataForm" class="hidden">
      <div class="section-head">
        <div class="icon"><i class="fas fa-calendar-day"></i></div> วันที่ปฏิบัติงาน
      </div>
      <div class="field">
        <input type="date" name="date" id="date" required readonly title="วันที่ปฏิบัติงานกำหนดอัตโนมัติ">
      </div>

      <div class="section-head">
        <div class="icon"><i class="fas fa-user-tie"></i></div> ข้อมูลผู้ส่งงาน
      </div>
      <div class="field">
        <label>ชื่อส่งเสริม <span class="req">*</span></label>
        <select name="firstName" id="firstName" required>
          <option value="">กรุณาเลือกชื่อส่งเสริม</option>
        </select>
      </div>
      <div class="field">
        <label>Collector <span class="req">*</span></label>
        <select name="collector" id="collector" required>
          <option value="">กรุณาเลือก Collector</option>
        </select>
      </div>

      <div class="section-head">
        <div class="icon"><i class="fas fa-map-marked-alt"></i></div> ข้อมูลพื้นที่
      </div>
      <div class="field">
        <label>อำเภอ <span class="req">*</span></label>
        <input type="text" name="district" required>
      </div>
      <div class="field">
        <label>ผู้ติดต่อ <span class="req">*</span></label>
        <input type="text" name="contact" required>
      </div>
      <div class="field">
        <label>ชนิดพืช <span class="req">*</span></label>
        <select name="plantType" id="plantType" required>
          <option value="">กรุณาเลือกชนิดพืช</option>
        </select>
      </div>
      <div class="field">
        <label>อื่นๆ ถ้ามี</label>
        <input type="text" name="other">
      </div>

      <div class="section-head">
        <div class="icon"><i class="fas fa-clipboard-list"></i></div> รายละเอียดการปฏิบัติงาน
      </div>
      <div class="field">
        <textarea name="details" required placeholder="ระบุรายละเอียดการปฏิบัติงาน"></textarea>
      </div>

      <div class="section-head">
        <div class="icon"><i class="fas fa-map-pin"></i></div> สถานที่เข้าทำงาน
      </div>
      <div class="field">
        <div class="map-container" id="mapContainer"></div>
        <div class="coords-note hidden" id="coordsNote"><i class="fas fa-crosshairs"></i><span id="coordsText"></span>
        </div>
      </div>

      <div class="section-head">
        <div class="icon"><i class="fas fa-camera"></i></div> รูปภาพ
      </div>
      <div class="field">
        <label class="file-box" for="imageFile">
          <i class="fas fa-cloud-upload-alt"></i>
          เลือกรูปภาพ (จำเป็น)
        </label>
        <input type="file" name="imageFile" id="imageFile" accept="image/*" class="hidden" required>
        <div class="image-preview" id="imagePreview"></div>
      </div>

      <button type="submit" id="sub" class="submit-btn"><i class="fas fa-paper-plane"></i> บันทึกการส่งงาน</button>
      <p class="footnote"><i class="fas fa-leaf"></i> ระบบส่งเสริมการเกษตร • บริษัทเชียงใหม่โฟรเซ่นฟูดส์ จำกัด (มหาชน)
      </p>
    </form>
  </div>

  <script>
    let currentCoordinates = '';
    let userId = '';
    let userProfile = null;

    // ---------- บีบอัดรูปอัตโนมัติ (ลดขนาดก่อนอัปโหลด เพื่อให้บันทึกเร็วขึ้น) ----------
    let compressedUpload = null; // { base64, type, name } ของรูปที่บีบอัดแล้ว
    const IMAGE_MAX_DIM = 1080; // ความยาวด้านที่ยาวที่สุด (px) — เล็กลงเพื่อให้ไฟล์อัปโหลดเร็วขึ้น
    const IMAGE_QUALITY = 0.7; // คุณภาพ JPEG (0-1) — ลดลงเล็กน้อยเพื่อให้ไฟล์เล็กลง อัปโหลดเร็วขึ้น
    const COMPRESS_THRESHOLD = 300 * 1024; // รูป ≤ 300KB ส่งไฟล์เดิมได้เลย

    function formatBytes(bytes) {
      if (!bytes && bytes !== 0) return '0 KB';
      if (bytes < 1024) return bytes + ' B';
      return (bytes / 1024).toFixed(0) + ' KB';
    }

    // บีบอัดรูปด้วย Canvas → คืน Blob JPEG ถ้าทำได้ / null = ใช้ไฟล์เดิม
    function compressImage(file) {
      return new Promise((resolve) => {
        if (!file || !file.type || file.size <= COMPRESS_THRESHOLD || file.type === 'image/gif') {
          resolve(null); // เล็กอยู่แล้ว / GIF ภาพเคลื่อนไหว → ไม่บีบ
          return;
        }
        try {
          const img = new Image();
          const objectUrl = URL.createObjectURL(file);
          img.onload = function () {
            URL.revokeObjectURL(objectUrl);
            try {
              let width = img.naturalWidth || img.width;
              let height = img.naturalHeight || img.height;
              if (!width || !height) { resolve(null); return; }
              if (width > IMAGE_MAX_DIM || height > IMAGE_MAX_DIM) {
                const ratio = Math.min(IMAGE_MAX_DIM / width, IMAGE_MAX_DIM / height);
                width = Math.round(width * ratio);
                height = Math.round(height * ratio);
              }
              const canvas = document.createElement('canvas');
              canvas.width = width;
              canvas.height = height;
              canvas.getContext('2d').drawImage(img, 0, 0, width, height);
              canvas.toBlob(function (blob) {
                if (!blob) { resolve(null); return; }
                resolve(blob);
              }, 'image/jpeg', IMAGE_QUALITY);
            } catch (e) {
              resolve(null); // เปิด/วาดภาพไม่ได้ → ใช้ไฟล์เดิม
            }
          };
          img.onerror = function () {
            URL.revokeObjectURL(objectUrl);
            resolve(null);
          };
          img.src = objectUrl;
        } catch (e) {
          resolve(null);
        }
      });
    }

    // แปลง Blob → base64 (เฉพาะข้อมูล ไม่มี prefix)
    function blobToBase64(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = () => reject(new Error('อ่านรูปที่บีบอัดไม่ได้'));
        reader.readAsDataURL(blob);
      });
    }

    // รอ promise พร้อม timeout — กัน LIFF/API ค้างหน้าไปเรื่อยๆ (คืนค่า fallback แทน)
    function withTimeout(promise, ms, fallback) {
      if (promise && typeof promise.catch === 'function') {
        promise.catch(function () { /* ป้องกัน unhandled rejection */ });
      }
      return Promise.race([
        Promise.resolve(promise),
        new Promise(function (resolve) { setTimeout(function () { resolve(fallback); }, ms); })
      ]);
    }

    // Initialize LIFF (มี timeout — กันค้างที่ "กำลังโหลด..." ตลอดไป)
    async function initializeLiff() {
      try {
        if (typeof liff === 'undefined') throw new Error('LIFF SDK โหลดไม่สำเร็จ (เปิดนอก LINE หรือเน็ตขัดข้อง)');
        await withTimeout(liff.init({ liffId: '2007528760-v8N7EXG1' }), 8000, null); // Replace with your LIFF ID
        if (typeof liff.isLoggedIn === 'function' && liff.isLoggedIn()) {
          const profile = await withTimeout(liff.getProfile(), 5000, null);
          if (profile) {
            userId = profile.userId;
            userProfile = profile;
            document.getElementById('displayName').textContent = profile.displayName;
            const avatarBox = document.getElementById('avatarBox');
            if (profile.pictureUrl) {
              document.getElementById('profileImage').src = profile.pictureUrl;
              avatarBox.classList.remove('no-photo');
            } else {
              avatarBox.classList.add('no-photo');
            }
          } else {
            // ได้โปรไฟล์ช้าเกิน 5 วิ → ไปต่อก่อน (ไม่ค้างหน้า)
            document.getElementById('displayName').textContent = 'ยินดีต้อนรับ';
            document.getElementById('avatarBox').classList.add('no-photo');
          }
        } else {
          liff.login();
        }
      } catch (error) {

    function getLocation() {
      return new Promise((resolve, reject) => {
        if (!navigator.geolocation) {
          reject(new Error('GPS_NOT_SUPPORTED'));
          return;
        }

        const isAndroid = /Android/i.test(navigator.userAgent);
        const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

        console.log('Device detection:', { isAndroid, isIOS, userAgent: navigator.userAgent });

        const timeoutDuration = isIOS ? 15000 : 10000;
        const locationOptions = {
          enableHighAccuracy: true,
          timeout: timeoutDuration - 2000,
          maximumAge: isIOS ? 30000 : 0
        };

        console.log('GPS options:', locationOptions);

        const timeoutId = setTimeout(() => {
          reject(new Error('GPS_TIMEOUT'));
        }, timeoutDuration);

        navigator.geolocation.getCurrentPosition(
          (position) => {
            clearTimeout(timeoutId);
            console.log('GPS success:', position.coords);
            resolve(position);
          },
          (error) => {
            clearTimeout(timeoutId);
            console.log('GPS error:', error);
            let errorMessage = '';
            switch (error.code) {
              case error.PERMISSION_DENIED:
                errorMessage = isIOS ? "GPS_DENIED_IOS" : "GPS_DENIED_ANDROID";
                break;
              case error.POSITION_UNAVAILABLE:
                errorMessage = isIOS ? "GPS_UNAVAILABLE_IOS" : "GPS_UNAVAILABLE_ANDROID";
                break;
              case error.TIMEOUT:
                errorMessage = isIOS ? "GPS_TIMEOUT_IOS" : "GPS_TIMEOUT_ANDROID";
                break;
              default:
                errorMessage = isIOS ? "GPS_UNKNOWN_ERROR_IOS" : "GPS_UNKNOWN_ERROR_ANDROID";
                break;
            }
            reject(new Error(errorMessage));
          },
          locationOptions
        );
      });
    }

    // Initialize app with GPS check — GPS เริ่มทันที ขนานกับ LIFF (กันค้างที่หน้าตรวจสอบ GPS)
    async function initializeApp() {
      document.getElementById('gpsCheckingScreen').style.display = 'flex';

      dateInput.addEventListener('mousedown', function (e) { e.preventDefault(); });

      dateInput.addEventListener('keydown', function (e) { e.preventDefault(); });

      // LIFF (มี timeout ด้านใน — ไม่ค้าง) ขนานกับ GPS

    // ---------- โหลด Select (แคช + ดึงข้อมูล) ----------
    const SCRIPT_BASE_URL = 'https://script.google.com/macros/s/AKfycbzniYO49YaS_3gv-V1WoLakPP14j6D9HScO6XCMDMzl3LdkADSI_RN1gVpaygghwdLD/exec';
    const CACHE_TTL = 12 * 60 * 60 * 1000; // 12 ชั่วโมง (ข้อมูล Select เปลี่ยนบ่อยน้อย)

    function getCache(key) {
      try {
        const raw = localStorage.getItem(key);
        if (!raw) return null;
        const { ts, data } = JSON.parse(raw);
        if (Date.now() - ts > CACHE_TTL) return null;
        return data;
      } catch (e) { return null; }
    }

    function setCache(key, data) {
      try { localStorage.setItem(key, JSON.stringify({ ts: Date.now(), data: data })); } catch (e) { /* localStorage ไม่พร้อมใช้งาน */ }
    }

    // แปลงข้อผิดพลาดให้ผู้ใช้เข้าใจว่าต้องแก้อะไร
    function describeApiError(error) {
      if (!error) return 'เกิดข้อผิดพลาดในการเชื่อมต่อ';
      if (error.name === 'AbortError') return 'API ตอบช้าเกินไป (หมดเวลา 60 วินาที) — ลองเปิดหน้าใหม่อีกครั้ง';
      if (error.message === 'Failed to fetch') return 'เชื่อมต่อกับ API ไม่ได้ (CORS/เครือข่าย) — ตรวจว่าเปิดหน้านี้จากลิงก์ LINE อย่างเป็นทางการ';
      if (/Unexpected token|did not match the expected pattern/.test(error.message)) return 'API ตอบกลับเป็นหน้า HTML (ต้องล็อกอิน Google หรือยังไม่เปิดสาธารณะ) — ไปที่ Google Apps Script > Deploy > Manage deployments แล้วตั้งค่า Who has access เป็น Anyone';
      return error.message || 'เกิดข้อผิดพลาดในการเชื่อมต่อ';
    }

    // อ่าน response โดยตรวจเนื้อหาจริง (GAS มักคืน JSON พร้อม header text/html)
    function parseResponseBody(response) {
      return response.text().then(text => {
        const trimmed = text.trim();
        if (!trimmed) throw new Error('API ตอบกลับว่างเปล่า');
        // ถ้าเป็น HTML (หน้า login/error ของ Google) → แจ้งเตือนชัดเจน
        if (trimmed.charAt(0) === '<') {
          const e = new Error('API ตอบกลับเป็นหน้า HTML (ต้องล็อกอิน Google หรือยังไม่เปิดสาธารณะ) — ไปที่ Google Apps Script > Deploy > Manage deployments แล้วตั้งค่า Who has access เป็น Anyone');
          e.apiError = true;
          throw e;
        }
        try {
          return JSON.parse(trimmed);
        } catch (e) {
          const err = new Error('API ตอบกลับไม่ใช่ JSON ที่ถูกต้อง: ' + trimmed.slice(0, 80));
          err.apiError = true;
          throw err;
        }
      });
    }

    // เติมตัวเลือกใน Select และสร้าง/อัปเดต Tom Select (กัน option ซ้ำ)
    function fillSelect(selectId, items, placeholder) {
      if (!Array.isArray(items) || !items.length) return;
      const selectEl = document.getElementById(selectId);
      if (!selectEl) return;
      const existing = selectEl._tomSelect;
      if (existing) {
        existing.clearOptions();
        existing.addOptions(items.map(v => ({ value: v, text: v })));
        existing.refreshOptions(false);
        return;
      }
      items.forEach(name => {
        const o = document.createElement('option');
        o.value = name;
        o.text = name;
        selectEl.appendChild(o);
      });
      selectEl._tomSelect = new TomSelect('#' + selectId, { placeholder: placeholder, allowEmptyOption: true });
    }

    // โหลดข้อมูล Select: ใช้แคชทันที แล้วค่อยดึงจาก API อัปเดตเบื้องหลัง
    function loadSelect(action, selectId, cacheKey, placeholder, errorLabel, attempt) {
      attempt = attempt || 0;
      const url = SCRIPT_BASE_URL + '?action=' + action;
      const cached = getCache(cacheKey);
      if (cached && cached.length) fillSelect(selectId, cached, placeholder);

      // ถ้า GAS ตอบช้า/ค้าง (cold start) ให้ timeout 60 วินาที
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 60000);

      // ถ้าเกิน 8 วิ ยังไม่ตอบ → แจ้งแบบ toast เล็กๆ (ไม่บล็อกการใช้งาน) — เฉพาะครั้งแรกที่ยังไม่มีแคช
      const slowTimer = setTimeout(() => {
        if (!cached || !cached.length) {
          Swal.fire({
            toast: true,
            position: 'bottom',
            icon: 'info',
            title: 'กำลังโหลดข้อมูล...',
            text: 'API กำลังตอบช้า (Google Apps Script cold start) กรุณารอสักครู่',
            timer: 4000,
            showConfirmButton: false,
            confirmButtonColor: '#059669'
          });
        }
      }, 8000);

      return fetch(url, { signal: controller.signal })
        .then(response => {
          if (!response.ok) {
            // GAS คืน HTTP error (403 = ไม่เปิดสาธารณะ, 404 = URL ผิด/ถูกลบ)
            const statusText = response.status === 403
              ? 'API ยังไม่เปิดใช้งานสาธารณะ (HTTP 403) — ไปที่ Google Apps Script > Deploy > Manage deployments แล้วตั้งค่า Who has access เป็น Anyone'
              : response.status === 404
                ? 'ไม่พบ API (HTTP 404) — ตรวจสอบ URL ของ Google Apps Script หรือ Deployment ถูกลบไปแล้ว'
                : 'API ตอบกลับ HTTP ' + response.status;
            const e = new Error(statusText);
            e.apiError = true;
            throw e;
          }
          return parseResponseBody(response);
        })
        .then(data => {
          if (data.error) {
            // มีข้อมูลแคชแสดงอยู่แล้ว → ไม่ต้องเด้ง error ซ้ำ
            if (!cached || !cached.length) {
              Swal.fire({ icon: 'error', title: 'ข้อผิดพลาด', text: 'ไม่สามารถโหลด ' + errorLabel + ' ได้: ' + data.error, confirmButtonColor: '#059669' });
            }
            return;
          }
          if (!Array.isArray(data) || !data.length) return;
          setCache(cacheKey, data);
          fillSelect(selectId, data, placeholder);
        })
        .catch(error => {
          // มีข้อมูลแคชแสดงอยู่แล้ว → แค่ log ไม่ต้องเด้ง error ซ้ำ
          if (cached && cached.length) {
            console.warn('อัปเดต ' + errorLabel + ' ไม่สำเร็จ ใช้ข้อมูลเก่า:', error);
            return;
          }
          // ลองใหม่เองอัตโนมัติ 2 ครั้ง (กัน cold start / เน็ตสะดุดชั่วคราว) ก่อนแจ้ง error
          if (attempt < 2) {
            setTimeout(() => loadSelect(action, selectId, cacheKey, placeholder, errorLabel, attempt + 1), 1500 * (attempt + 1));
            return;
          }
          const msg = error.apiError ? error.message : 'เกิดข้อผิดพลาดในการเชื่อมต่อ: ' + describeApiError(error);
          Swal.fire({
            icon: 'error',
            title: 'ข้อผิดพลาด',
            text: msg,
            confirmButtonColor: '#059669',
            showCancelButton: true,
            confirmButtonText: 'ลองใหม่',
            cancelButtonText: 'ปิด'
          }).then(result => {
            if (result.isConfirmed) loadSelect(action, selectId, cacheKey, placeholder, errorLabel);
          });
        })
        .finally(() => { clearTimeout(timer); clearTimeout(slowTimer); });
    }

    // โหลด Select ทั้ง 3 ช่องแบบขนาน (ไม่ต้องรอ GPS)
    function loadSelectData() {
      loadSelect('getPromoterNames', 'firstName', 'apm_promoterNames_v1', 'กรุณาเลือกชื่อส่งเสริม', 'ชื่อส่งเสริม');
      loadSelect('getCollectors', 'collector', 'apm_collectors_v1', 'กรุณาเลือก Collector', 'Collector');
      loadSelect('getPlantTypes', 'plantType', 'apm_plantTypes_v1', 'กรุณาเลือกชนิดพืช', 'ชนิดพืช');
    }

    // Initialize when page loads — DOMContentLoaded เร็วกว่า window.onload (ไม่ต้องรอ font/รูปโหลดเสร็จ)
    document.addEventListener('DOMContentLoaded', function () {
      initializeApp();
      loadSelectData(); // เริ่มโหลด Select ทันที ขนานกับ GPS/LIFF
    });
  </script>
