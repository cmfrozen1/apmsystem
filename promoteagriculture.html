<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ส่งงานส่งเสริมการเกษตร</title>
  <meta name="description" content="แบบฟอร์มส่งงานส่งเสริมการเกษตร">
  <link rel="icon" type="image/png" sizes="96x96" href="https://lh3.googleusercontent.com/a/ACg8ocJt_yMM3sBNowu7Y5BiDgl5qQ9R1vTL5vokSt_XWwuqA8_m7QU=s288-c-no">
  <!-- Preconnect to speed up CDN connections -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  <link rel="preconnect" href="https://code.jquery.com">
  <link rel="dns-prefetch" href="https://static.line-scdn.net">
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/css/tom-select.min.css" rel="stylesheet" />
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js" defer></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/js/tom-select.complete.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11" defer></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Prompt', sans-serif;
      background: linear-gradient(155deg, #f0fdf4 0%, #ecfdf5 45%, #d1fae5 100%);
      min-height: 100vh;
      padding-bottom: 3rem;
      background-attachment: fixed;
    }

    /* Header */
    .app-header {
      background: linear-gradient(120deg, #065f46, #059669 55%, #10b981);
      color: #fff;
      padding: 1.3rem 1.2rem;
      display: flex;
      align-items: center;
      gap: 0.9rem;
      box-shadow: 0 8px 24px rgba(5, 150, 105, 0.28);
      position: sticky;
      top: 0;
      z-index: 500;
    }
    .avatar {
      width: 48px; height: 48px;
      border-radius: 50%;
      background: #d1fae5;
      border: 2px solid rgba(255,255,255,0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      font-weight: 700;
      color: #047857;
      overflow: hidden;
      flex-shrink: 0;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .avatar.no-photo img { display: none; }
    .app-header .titles { flex: 1; min-width: 0; }
    .app-header .titles h1 { font-size: 1.05rem; font-weight: 700; line-height: 1.35; }
    .app-header .titles p { font-size: 0.78rem; color: #d1fae5; }
    .leaf-badge {
      width: 40px; height: 40px;
      border-radius: 12px;
      background: rgba(255,255,255,0.16);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      flex-shrink: 0;
    }

    .card {
      max-width: 540px;
      margin: 1.2rem auto 0;
      background: #fff;
      border-radius: 22px;
      box-shadow: 0 18px 44px rgba(2, 44, 34, 0.14);
      padding: 1.6rem 1.5rem 1.8rem;
      position: relative;
      border: 1px solid #eef2ef;
    }

    /* GPS checking screen */
    .gps-checking {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 3rem 1.2rem;
      min-height: 420px;
    }
    .gps-icon-wrap {
      width: 96px; height: 96px;
      border-radius: 50%;
      background: linear-gradient(135deg, #d1fae5, #a7f3d0);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.6rem;
      box-shadow: 0 12px 30px rgba(5, 150, 105, 0.25);
      animation: gpsPulse 2.2s ease-in-out infinite;
    }
    .gps-icon-wrap i { font-size: 2.6rem; color: #047857; }
    @keyframes gpsPulse {
      0%, 100% { transform: scale(1); box-shadow: 0 12px 30px rgba(5, 150, 105, 0.25); }
      50% { transform: scale(1.06); box-shadow: 0 14px 38px rgba(5, 150, 105, 0.4); }
    }
    .gps-checking h3 { font-size: 1.3rem; font-weight: 700; color: #064e3b; margin-bottom: 0.6rem; }
    .gps-checking p { color: #6b7280; font-size: 0.9rem; margin-bottom: 1.8rem; }
    .spinner {
      width: 42px; height: 42px;
      border: 4px solid #d1fae5;
      border-top: 4px solid #059669;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .hidden { display: none !important; }

    .section-head {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      font-weight: 600;
      color: #065f46;
      margin: 1.3rem 0 0.7rem;
      padding-bottom: 0.5rem;
      border-bottom: 2px solid #f0fdf4;
    }
    .section-head:first-of-type { margin-top: 0; }
    .section-head .icon {
      width: 30px; height: 30px;
      border-radius: 9px;
      background: #d1fae5;
      color: #047857;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
    }

    .field { margin-bottom: 0.9rem; }
    .field label {
      display: block;
      font-size: 0.82rem;
      font-weight: 500;
      color: #4b5563;
      margin-bottom: 0.35rem;
    }
    .field label .req { color: #dc2626; }
    input[type="text"], input[type="date"], input[type="file"], textarea {
      width: 100%;
      padding: 0.72rem 0.9rem;
      border: 1.5px solid #d1d5db;
      border-radius: 12px;
      outline: none;
      font-family: 'Prompt', sans-serif;
      font-size: 0.9rem;
      background: #fff;
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
      color: #1f2937;
    }
    input:focus, textarea:focus {
      border-color: #10b981;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.18);
    }
    textarea { min-height: 96px; resize: vertical; }
    input[type="file"] { padding: 0.5rem 0.9rem; }

    .file-box {
      border: 2px dashed #a7f3d0;
      border-radius: 14px;
      padding: 1.1rem;
      text-align: center;
      color: #047857;
      font-size: 0.85rem;
      background: #f0fdf4;
      cursor: pointer;
      transition: all 0.25s ease;
    }
    .file-box:hover { border-color: #059669; background: #ecfdf5; }
    .file-box i { font-size: 1.4rem; display: block; margin-bottom: 0.3rem; }

    .image-preview { margin-top: 0.8rem; }
    .image-preview img {
      width: 100%;
      max-height: 260px;
      object-fit: cover;
      border-radius: 14px;
      border: 2px solid #d1fae5;
      box-shadow: 0 8px 20px rgba(2, 44, 34, 0.12);
    }
    .map-container iframe { border-radius: 14px; border: 2px solid #d1fae5; }
    .coords-note {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.75rem;
      color: #047857;
      background: #f0fdf4;
      padding: 0.45rem 0.8rem;
      border-radius: 10px;
      margin-top: 0.5rem;
      word-break: break-all;
    }
    .coords-note i { flex-shrink: 0; }

    .submit-btn {
      width: 100%;
      margin-top: 1.4rem;
      padding: 0.95rem 1rem;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      font-family: 'Prompt', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      color: #fff;
      background: linear-gradient(120deg, #059669, #10b981);
      box-shadow: 0 10px 26px rgba(5, 150, 105, 0.35);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.55rem;
      transition: all 0.25s ease;
    }
    .submit-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 14px 32px rgba(5, 150, 105, 0.45); }
    .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    /* Tom Select green styling */
    .ts-wrapper { width: 100% !important; }
    .ts-control {
      border: 1.5px solid #d1d5db !important;
      border-radius: 12px !important;
      background-color: #ffffff !important;
      padding: 0.6rem 1rem !important;
      font-size: 0.9rem !important;
      color: #374151 !important;
      min-height: 44px !important;
      font-family: 'Prompt', sans-serif !important;
      cursor: pointer;
    }
    .ts-wrapper.focus .ts-control {
      border-color: #10b981 !important;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.18) !important;
    }
    .ts-dropdown {
      border-radius: 12px !important;
      border: 1.5px solid #d1d5db !important;
      font-family: 'Prompt', sans-serif !important;
      font-size: 0.9rem !important;
    }
    .ts-dropdown .option { font-family: 'Prompt', sans-serif !important; padding: 0.5rem 1rem; }
    .ts-dropdown .option.active { background-color: #059669 !important; color: #fff !important; }

    /* Loading overlay */
    .loading-overlay {
      display: none;
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(4px);
      border-radius: 22px;
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .loader {
      width: 50px; height: 50px;
      border: 5px solid #d1fae5;
      border-top: 5px solid #059669;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    .footnote {
      text-align: center;
      font-size: 0.75rem;
      color: #9ca3af;
      margin-top: 1.4rem;
    }

    @media (max-width: 480px) {
      .card { margin: 0.9rem 0.8rem 0; padding: 1.3rem 1.1rem 1.5rem; }
      .app-header { padding: 1rem 0.9rem; }
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="app-header">
    <div class="avatar" id="avatarBox"><img id="profileImage" src="" alt="Profile"><i class="fas fa-user"></i></div>
    <div class="titles">
      <h1>ส่งงานส่งเสริมการเกษตร</h1>
      <p id="displayName">กำลังโหลด...</p>
    </div>
    <div class="leaf-badge"><i class="fas fa-leaf"></i></div>
  </header>

  <div class="card">
    <div class="loading-overlay" id="loadingOverlay">
      <div class="loader"></div>
    </div>

    <!-- GPS Checking Screen -->
    <div id="gpsCheckingScreen" class="gps-checking">
      <div class="gps-icon-wrap"><i class="fas fa-map-marker-alt"></i></div>
      <h3>กำลังตรวจสอบ GPS</h3>
      <p>กรุณารอสักครู่ขณะที่เราตรวจสอบตำแหน่งของคุณ...</p>
      <div class="spinner"></div>
    </div>

    <!-- Main Form (Hidden until GPS ready) -->
    <form id="dataForm" class="hidden">
      <div class="section-head">
        <div class="icon"><i class="fas fa-calendar-day"></i></div> วันที่ปฏิบัติงาน
      </div>
      <div class="field">
        <input type="date" name="date" id="date" required>
      </div>

      <div class="section-head">
        <div class="icon"><i class="fas fa-user-tie"></i></div> ข้อมูลผู้ส่งงาน
      </div>
      <div class="field">
        <label>ชื่อส่งเสริม <span class="req">*</span></label>
        <select name="firstName" id="firstName" required>
          <option value="">กรุณาเลือกชื่อส่งเสริม</option>
        </select>
      </div>
      <div class="field">
        <label>Collector <span class="req">*</span></label>
        <select name="collector" id="collector" required>
          <option value="">กรุณาเลือก Collector</option>
        </select>
      </div>

      <div class="section-head">
        <div class="icon"><i class="fas fa-map-marked-alt"></i></div> ข้อมูลพื้นที่
      </div>
      <div class="field">
        <label>อำเภอ <span class="req">*</span></label>
        <input type="text" name="district" required>
      </div>
      <div class="field">
        <label>ผู้ติดต่อ <span class="req">*</span></label>
        <input type="text" name="contact" required>
      </div>
      <div class="field">
        <label>ชนิดพืช <span class="req">*</span></label>
        <select name="plantType" id="plantType" required>
          <option value="">กรุณาเลือกชนิดพืช</option>
        </select>
      </div>
      <div class="field">
        <label>อื่นๆ ถ้ามี</label>
        <input type="text" name="other">
      </div>

      <div class="section-head">
        <div class="icon"><i class="fas fa-clipboard-list"></i></div> รายละเอียดการปฏิบัติงาน
      </div>
      <div class="field">
        <textarea name="details" required placeholder="ระบุรายละเอียดการปฏิบัติงาน"></textarea>
      </div>

      <div class="section-head">
        <div class="icon"><i class="fas fa-map-pin"></i></div> สถานที่เข้าทำงาน
      </div>
      <div class="field">
        <div class="map-container" id="mapContainer"></div>
        <div class="coords-note hidden" id="coordsNote"><i class="fas fa-crosshairs"></i><span id="coordsText"></span></div>
      </div>

      <div class="section-head">
        <div class="icon"><i class="fas fa-camera"></i></div> รูปภาพ
      </div>
      <div class="field">
        <label class="file-box" for="imageFile">
          <i class="fas fa-cloud-upload-alt"></i>
          เลือกรูปภาพ (จำเป็น)
        </label>
        <input type="file" name="imageFile" id="imageFile" accept="image/*" class="hidden" required>
        <div class="image-preview" id="imagePreview"></div>
      </div>

      <button type="submit" id="sub" class="submit-btn"><i class="fas fa-paper-plane"></i> บันทึกการส่งงาน</button>
      <p class="footnote"><i class="fas fa-leaf"></i> ระบบส่งเสริมการเกษตร • บริษัทเชียงใหม่โฟรเซ่นฟูดส์ จำกัด (มหาชน)</p>
    </form>
  </div>

  <script>
    let currentCoordinates = '';
    let userId = '';
    let userProfile = null;

    // Initialize LIFF
    async function initializeLiff() {
      try {
        await liff.init({ liffId: '2007528760-v8N7EXG1' }); // Replace with your LIFF ID
        if (liff.isLoggedIn()) {
          const profile = await liff.getProfile();
          userId = profile.userId;
          userProfile = profile;
          document.getElementById('displayName').textContent = profile.displayName;
          const avatarBox = document.getElementById('avatarBox');
          if (profile.pictureUrl) {
            document.getElementById('profileImage').src = profile.pictureUrl;
            avatarBox.classList.remove('no-photo');
          } else {
            avatarBox.classList.add('no-photo');
          }
        } else {
          liff.login();
        }
      } catch (error) {
        document.getElementById('displayName').textContent = 'ยินดีต้อนรับ';
        document.getElementById('avatarBox').classList.add('no-photo');
        Swal.fire({
          icon: 'error',
          title: 'LIFF Initialization Failed',
          text: error.message,
          confirmButtonColor: '#059669'
        });
      }
    }

    // Send GPS warning message and close LIFF
    async function sendGPSWarningAndClose(errorType) {
      try {
        const isAndroid = /Android/i.test(navigator.userAgent);
        const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

        let deviceInstructions = [];
        let warningTitle = "ท่านยังไม่ได้เปิด GPS ขณะทำงาน";

        if (isIOS) {
          deviceInstructions = [
            "1. ไปที่ การตั้งค่า > ความเป็นส่วนตัวและความปลอดภัย > บริการตำแหน่ง",
            "2. เปิด บริการตำแหน่ง",
            "3. เลื่อนลงหา LINE และเลือก 'ขณะใช้แอป'",
            "4. เปิดแอปพลิเคชันใหม่อีกครั้ง"
          ];
          if (errorType && errorType.includes('DENIED')) {
            warningTitle = "ไม่อนุญาตให้ LINE เข้าถึงตำแหน่ง (iOS)";
          }
        } else if (isAndroid) {
          deviceInstructions = [
            "1. ไปที่ การตั้งค่า > ตำแหน่ง และเปิดใช้งาน",
            "2. การตั้งค่า > แอป > LINE > สิทธิ์",
            "3. เปิดสิทธิ์ 'ตำแหน่ง'",
            "4. เปิดแอปพลิเคชันใหม่อีกครั้ง"
          ];
          if (errorType && errorType.includes('DENIED')) {
            warningTitle = "ไม่อนุญาตให้ LINE เข้าถึงตำแหน่ง (Android)";
          }
        } else {
          deviceInstructions = [
            "1. เปิดการใช้งาน GPS/Location",
            "2. อนุญาตให้ LINE เข้าถึงตำแหน่ง",
            "3. เปิดแอปพลิเคชันใหม่อีกครั้ง"
          ];
        }

        const instructionContents = deviceInstructions.map((instruction, index) => ({
          type: "text",
          text: instruction,
          size: "sm",
          color: "#666666",
          margin: index === 0 ? "sm" : "xs",
          wrap: true
        }));

        const flexMessage = {
          type: "flex",
          altText: "แจ้งเตือน: ไม่พบการเปิด GPS",
          contents: {
            type: "bubble",
            body: {
              type: "box",
              layout: "vertical",
              contents: [
                {
                  type: "box",
                  layout: "vertical",
                  contents: [
                    {
                      type: "text",
                      text: isIOS ? "📱🔴" : "🤖🔴",
                      size: "xxl",
                      align: "center"
                    }
                  ],
                  alignItems: "center",
                  paddingBottom: "md"
                },
                {
                  type: "text",
                  text: "⚠️ แจ้งเตือน",
                  weight: "bold",
                  size: "xl",
                  color: "#FF6B6B",
                  align: "center"
                },
                {
                  type: "text",
                  text: warningTitle,
                  size: "md",
                  color: "#333333",
                  align: "center",
                  wrap: true,
                  margin: "md"
                },
                {
                  type: "text",
                  text: `อุปกรณ์: ${isIOS ? 'iOS' : isAndroid ? 'Android' : 'อื่นๆ'}`,
                  size: "xs",
                  color: "#999999",
                  align: "center",
                  margin: "sm"
                },
                {
                  type: "separator",
                  margin: "lg"
                },
                {
                  type: "box",
                  layout: "vertical",
                  contents: [
                    {
                      type: "text",
                      text: `วิธีแก้ไขสำหรับ ${isIOS ? 'iOS' : isAndroid ? 'Android' : 'อุปกรณ์ของคุณ'}:`,
                      weight: "bold",
                      size: "sm",
                      color: "#666666"
                    },
                    ...instructionContents
                  ],
                  margin: "lg",
                  spacing: "xs"
                }
              ]
            },
            styles: {
              body: {
                backgroundColor: "#FFFFFF"
              }
            }
          }
        };

        console.log(`Sending GPS warning message to chat for ${isIOS ? 'iOS' : isAndroid ? 'Android' : 'Unknown'} device...`);
        await liff.sendMessages([flexMessage]);
        console.log('GPS warning message sent successfully');

        await new Promise(resolve => setTimeout(resolve, 2500));
        console.log('Closing LIFF window...');
        liff.closeWindow();

      } catch (error) {
        console.error('Error sending GPS warning message:', error);
        setTimeout(() => {
          try { liff.closeWindow(); } catch (e) { /* noop */ }
        }, 500);
      }
    }

    function getLocation() {
      return new Promise((resolve, reject) => {
        if (!navigator.geolocation) {
          reject(new Error('GPS_NOT_SUPPORTED'));
          return;
        }

        const isAndroid = /Android/i.test(navigator.userAgent);
        const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

        console.log('Device detection:', { isAndroid, isIOS, userAgent: navigator.userAgent });

        const timeoutDuration = isIOS ? 15000 : 10000;
        const locationOptions = {
          enableHighAccuracy: true,
          timeout: timeoutDuration - 2000,
          maximumAge: isIOS ? 30000 : 0
        };

        console.log('GPS options:', locationOptions);

        const timeoutId = setTimeout(() => {
          reject(new Error('GPS_TIMEOUT'));
        }, timeoutDuration);

        navigator.geolocation.getCurrentPosition(
          (position) => {
            clearTimeout(timeoutId);
            console.log('GPS success:', position.coords);
            resolve(position);
          },
          (error) => {
            clearTimeout(timeoutId);
            console.log('GPS error:', error);
            let errorMessage = '';
            switch (error.code) {
              case error.PERMISSION_DENIED:
                errorMessage = isIOS ? "GPS_DENIED_IOS" : "GPS_DENIED_ANDROID";
                break;
              case error.POSITION_UNAVAILABLE:
                errorMessage = isIOS ? "GPS_UNAVAILABLE_IOS" : "GPS_UNAVAILABLE_ANDROID";
                break;
              case error.TIMEOUT:
                errorMessage = isIOS ? "GPS_TIMEOUT_IOS" : "GPS_TIMEOUT_ANDROID";
                break;
              default:
                errorMessage = isIOS ? "GPS_UNKNOWN_ERROR_IOS" : "GPS_UNKNOWN_ERROR_ANDROID";
                break;
            }
            reject(new Error(errorMessage));
          },
          locationOptions
        );
      });
    }

    function showPosition(position) {
      currentCoordinates = position.coords.latitude + ", " + position.coords.longitude;
      const mapHtml = `<iframe width="100%" height="300" frameborder="0" scrolling="no" marginheight="0" marginwidth="0" src="https://maps.google.com/maps?q=${currentCoordinates}&t=&z=15&ie=UTF8&iwloc=&output=embed"></iframe>`;
      document.getElementById('mapContainer').innerHTML = mapHtml;
      const note = document.getElementById('coordsNote');
      note.classList.remove('hidden');
      document.getElementById('coordsText').textContent = 'พิกัด: ' + currentCoordinates;
    }

    // Initialize app with GPS check
    async function initializeApp() {
      try {
        document.getElementById('gpsCheckingScreen').style.display = 'flex';
        document.getElementById('dataForm').classList.add('hidden');

        await initializeLiff();

        const position = await getLocation();
        showPosition(position);

        document.getElementById('gpsCheckingScreen').style.display = 'none';
        document.getElementById('dataForm').classList.remove('hidden');

        const today = new Date().toISOString().split('T')[0];
        document.getElementById('date').value = today;
      } catch (error) {
        console.error('GPS Error:', error.message);

        if (error.message.includes('GPS_') || error.message.includes('GPS')) {
          await sendGPSWarningAndClose(error.message);
        } else {
          document.getElementById('gpsCheckingScreen').style.display = 'flex';
          Swal.fire({
            icon: 'error',
            title: 'เกิดข้อผิดพลาด',
            text: 'ไม่สามารถเริ่มต้นแอปพลิเคชันได้: ' + error.message,
            confirmButtonColor: '#059669'
          });
        }
      }
    }

    document.getElementById('imageFile').addEventListener('change', function (event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function (e) {
          document.getElementById('imagePreview').innerHTML = `<img src="${e.target.result}" alt="Image Preview">`;
        };
        reader.readAsDataURL(file);
      }
    });

    document.getElementById('dataForm').addEventListener('submit', async function (event) {
      event.preventDefault();

      const fileInput = document.getElementById('imageFile').files[0];
      if (!fileInput) {
        Swal.fire({ icon: 'warning', title: 'กรุณาเลือกรูปภาพ', text: 'ต้องแนบรูปภาพก่อนบันทึกการส่งงาน', confirmButtonColor: '#059669' });
        return;
      }
      if (!currentCoordinates) {
        Swal.fire({ icon: 'warning', title: 'ยังไม่มีพิกัด GPS', text: 'กรุณารอให้ระบบตรวจสอบตำแหน่งสำเร็จก่อนส่งงาน', confirmButtonColor: '#059669' });
        return;
      }

      const loadingOverlay = document.getElementById('loadingOverlay');
      loadingOverlay.style.display = 'flex';

      const submitButton = document.getElementById('sub');
      submitButton.disabled = true;
      submitButton.textContent = "กำลังบันทึก...";

      const formData = new FormData(this);
      const submitDate = new Date().toLocaleDateString();
      const submitTime = new Date().toLocaleTimeString();

      const reader = new FileReader();
      reader.onload = async function (event) {
        const base64 = event.target.result.split(',')[1];
        const data = {
          date: formData.get('date'),
          firstName: formData.get('firstName'),
          district: formData.get('district'),
          collector: formData.get('collector'),
          contact: formData.get('contact'),
          plantType: formData.get('plantType'),
          other: formData.get('other'),
          details: formData.get('details'),
          coordinates: currentCoordinates,
          location: `https://maps.google.com/maps?q=${currentCoordinates}`,
          base64: base64,
          type: fileInput.type,
          name: fileInput.name,
          submitDate: submitDate,
          submitTime: submitTime,
          userId: userId
        };

        try {
          const response = await fetch('https://script.google.com/macros/s/AKfycbzniYO49YaS_3gv-V1WoLakPP14j6D9HScO6XCMDMzl3LdkADSI_RN1gVpaygghwdLD/exec', {
            method: "POST",
            body: JSON.stringify(data)
          });
          const result = await response.json();

          if (result.status !== "success") {
            throw new Error(result.message || "Failed to upload data and image");
          }

          const fileLink = result.fileLink;

          const flexMessage = {
            type: "flex",
            altText: "รายงานการทำงานส่งเสริมการเกษตร",
            contents: {
              type: "bubble",
              body: {
                type: "box",
                layout: "vertical",
                contents: [
                  {
                    type: "text",
                    text: "รายงานการทำงานส่งเสริมการเกษตร",
                    weight: "bold",
                    size: "md",
                    wrap: true
                  },
                  {
                    type: "box",
                    layout: "vertical",
                    margin: "lg",
                    spacing: "sm",
                    contents: [
                      { type: "text", text: `วันที่: ${data.date}`, wrap: true },
                      { type: "text", text: `ชื่อส่งเสริม: ${data.firstName}`, wrap: true },
                      { type: "text", text: `อำเภอ: ${data.district}`, wrap: true },
                      { type: "text", text: `Collector: ${data.collector}`, wrap: true },
                      { type: "text", text: `ผู้ติดต่อ: ${data.contact}`, wrap: true },
                      { type: "text", text: `ชนิดพืช: ${data.plantType}`, wrap: true },
                      { type: "text", text: `อื่นๆ: ${data.other || '-'}`, wrap: true },
                      { type: "text", text: `รายละเอียด: ${data.details}`, wrap: true },
                      { type: "text", text: `ส่งเมื่อ: ${data.submitDate} ${data.submitTime}`, wrap: true }
                    ]
                  }
                ]
              }
            }
          };

          const imageMessage = {
            type: "image",
            originalContentUrl: fileLink,
            previewImageUrl: fileLink
          };

          await liff.sendMessages([
            flexMessage,
            imageMessage,
            {
              type: "location",
              title: "สถานที่ทำงาน",
              address: data.district,
              latitude: parseFloat(currentCoordinates.split(',')[0]),
              longitude: parseFloat(currentCoordinates.split(',')[1])
            }
          ]);

          loadingOverlay.style.display = 'none';
          submitButton.textContent = "บันทึกการส่งงาน";
          submitButton.disabled = false;
          document.getElementById('dataForm').reset();
          document.getElementById('imagePreview').innerHTML = '';

          Swal.fire({
            icon: 'success',
            title: 'บันทึกและส่งสำเร็จ!',
            text: 'ข้อมูลถูกบันทึกและส่งไปยัง LINE Chat เรียบร้อยแล้ว',
            timer: 2000,
            showConfirmButton: false
          });

          // ปิดหน้าต่างหลังจากแสดงข้อความสำเร็จแล้ว (ไม่ปิดทันทีจนมองไม่เห็น Toast)
          setTimeout(function () {
            try { liff.closeWindow(); } catch (e) { /* noop */ }
          }, 1600);
        } catch (error) {
          loadingOverlay.style.display = 'none';
          Swal.fire({
            icon: 'error',
            title: 'เกิดข้อผิดพลาด',
            text: 'ไม่สามารถบันทึกหรือส่งข้อมูลได้: ' + error.message,
            confirmButtonColor: '#059669'
          });
          submitButton.textContent = "บันทึกการส่งงาน";
          submitButton.disabled = false;
        }
      };
      reader.readAsDataURL(fileInput);
    });

    // ---------- โหลด Select (แคช + ดึงข้อมูล) ----------
    const SCRIPT_BASE_URL = 'https://script.google.com/macros/s/AKfycbzniYO49YaS_3gv-V1WoLakPP14j6D9HScO6XCMDMzl3LdkADSI_RN1gVpaygghwdLD/exec';
    const CACHE_TTL = 12 * 60 * 60 * 1000; // 12 ชั่วโมง (ข้อมูล Select เปลี่ยนบ่อยน้อย)

    function getCache(key) {
      try {
        const raw = localStorage.getItem(key);
        if (!raw) return null;
        const { ts, data } = JSON.parse(raw);
        if (Date.now() - ts > CACHE_TTL) return null;
        return data;
      } catch (e) { return null; }
    }

    function setCache(key, data) {
      try { localStorage.setItem(key, JSON.stringify({ ts: Date.now(), data: data })); } catch (e) { /* localStorage ไม่พร้อมใช้งาน */ }
    }

    // แปลงข้อผิดพลาดให้ผู้ใช้เข้าใจว่าต้องแก้อะไร
    function describeApiError(error) {
      if (!error) return 'เกิดข้อผิดพลาดในการเชื่อมต่อ';
      if (error.name === 'AbortError') return 'API ตอบช้าเกินไป (หมดเวลา 60 วินาที) — ลองเปิดหน้าใหม่อีกครั้ง';
      if (error.message === 'Failed to fetch') return 'เชื่อมต่อกับ API ไม่ได้ (CORS/เครือข่าย) — ตรวจว่าเปิดหน้านี้จากลิงก์ LINE อย่างเป็นทางการ';
      if (/Unexpected token|did not match the expected pattern/.test(error.message)) return 'API ตอบกลับเป็นหน้า HTML (ต้องล็อกอิน Google หรือยังไม่เปิดสาธารณะ) — ไปที่ Google Apps Script > Deploy > Manage deployments แล้วตั้งค่า Who has access เป็น Anyone';
      return error.message || 'เกิดข้อผิดพลาดในการเชื่อมต่อ';
    }

    // อ่าน response โดยตรวจเนื้อหาจริง (GAS มักคืน JSON พร้อม header text/html)
    function parseResponseBody(response) {
      return response.text().then(text => {
        const trimmed = text.trim();
        if (!trimmed) throw new Error('API ตอบกลับว่างเปล่า');
        // ถ้าเป็น HTML (หน้า login/error ของ Google) → แจ้งเตือนชัดเจน
        if (trimmed.charAt(0) === '<') {
          const e = new Error('API ตอบกลับเป็นหน้า HTML (ต้องล็อกอิน Google หรือยังไม่เปิดสาธารณะ) — ไปที่ Google Apps Script > Deploy > Manage deployments แล้วตั้งค่า Who has access เป็น Anyone');
          e.apiError = true;
          throw e;
        }
        try {
          return JSON.parse(trimmed);
        } catch (e) {
          const err = new Error('API ตอบกลับไม่ใช่ JSON ที่ถูกต้อง: ' + trimmed.slice(0, 80));
          err.apiError = true;
          throw err;
        }
      });
    }

    // เติมตัวเลือกใน Select และสร้าง/อัปเดต Tom Select (กัน option ซ้ำ)
    function fillSelect(selectId, items, placeholder) {
      if (!Array.isArray(items) || !items.length) return;
      const selectEl = document.getElementById(selectId);
      if (!selectEl) return;
      const existing = selectEl._tomSelect;
      if (existing) {
        existing.clearOptions();
        existing.addOptions(items.map(v => ({ value: v, text: v })));
        existing.refreshOptions(false);
        return;
      }
      items.forEach(name => {
        const o = document.createElement('option');
        o.value = name;
        o.text = name;
        selectEl.appendChild(o);
      });
      selectEl._tomSelect = new TomSelect('#' + selectId, { placeholder: placeholder, allowEmptyOption: true });
    }

    // โหลดข้อมูล Select: ใช้แคชทันที แล้วค่อยดึงจาก API อัปเดตเบื้องหลัง
    function loadSelect(action, selectId, cacheKey, placeholder, errorLabel) {
      const url = SCRIPT_BASE_URL + '?action=' + action;
      const cached = getCache(cacheKey);
      if (cached && cached.length) fillSelect(selectId, cached, placeholder);

      // ถ้า GAS ตอบช้า/ค้าง (cold start) ให้ timeout 60 วินาที
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 60000);

      // ถ้าเกิน 8 วิ ยังไม่ตอบ → แจ้งว่ากำลังโหลด (กันผู้ใช้คิดว่าค้าง) — เฉพาะครั้งแรกที่ยังไม่มีแคช
      let slowNotified = false;
      const slowTimer = setTimeout(() => {
        if (!cached || !cached.length) {
          slowNotified = true;
          Swal.fire({
            icon: 'info',
            title: 'กำลังโหลดข้อมูล...',
            text: 'API กำลังตอบช้า (Google Apps Script cold start) — กรุณารอสักครู่ ถ้ายังไม่โหลดให้กดลองใหม่',
            timer: 6000,
            showConfirmButton: false,
            confirmButtonColor: '#059669'
          });
        }
      }, 8000);

      return fetch(url, { signal: controller.signal })
        .then(response => {
          if (!response.ok) {
            // GAS คืน HTTP error (403 = ไม่เปิดสาธารณะ, 404 = URL ผิด/ถูกลบ)
            const statusText = response.status === 403
              ? 'API ยังไม่เปิดใช้งานสาธารณะ (HTTP 403) — ไปที่ Google Apps Script > Deploy > Manage deployments แล้วตั้งค่า Who has access เป็น Anyone'
              : response.status === 404
                ? 'ไม่พบ API (HTTP 404) — ตรวจสอบ URL ของ Google Apps Script หรือ Deployment ถูกลบไปแล้ว'
                : 'API ตอบกลับ HTTP ' + response.status;
            const e = new Error(statusText);
            e.apiError = true;
            throw e;
          }
          return parseResponseBody(response);
        })
        .then(data => {
          if (data.error) {
            // มีข้อมูลแคชแสดงอยู่แล้ว → ไม่ต้องเด้ง error ซ้ำ
            if (!cached || !cached.length) {
              Swal.fire({ icon: 'error', title: 'ข้อผิดพลาด', text: 'ไม่สามารถโหลด ' + errorLabel + ' ได้: ' + data.error, confirmButtonColor: '#059669' });
            }
            return;
          }
          if (!Array.isArray(data) || !data.length) return;
          setCache(cacheKey, data);
          fillSelect(selectId, data, placeholder);
        })
        .catch(error => {
          // มีข้อมูลแคชแสดงอยู่แล้ว → แค่ log ไม่ต้องเด้ง error ซ้ำ
          if (cached && cached.length) {
            console.warn('อัปเดต ' + errorLabel + ' ไม่สำเร็จ ใช้ข้อมูลเก่า:', error);
            return;
          }
          const msg = error.apiError ? error.message : 'เกิดข้อผิดพลาดในการเชื่อมต่อ: ' + describeApiError(error);
          Swal.fire({
            icon: 'error',
            title: 'ข้อผิดพลาด',
            text: msg,
            confirmButtonColor: '#059669',
            showCancelButton: true,
            confirmButtonText: 'ลองใหม่',
            cancelButtonText: 'ปิด'
          }).then(result => {
            if (result.isConfirmed) loadSelect(action, selectId, cacheKey, placeholder, errorLabel);
          });
        })
        .finally(() => { clearTimeout(timer); clearTimeout(slowTimer); });
    }

    // โหลด Select ทั้ง 3 ช่องแบบขนาน (ไม่ต้องรอ GPS)
    function loadSelectData() {
      loadSelect('getPromoterNames', 'firstName', 'apm_promoterNames_v1', 'กรุณาเลือกชื่อส่งเสริม', 'ชื่อส่งเสริม');
      loadSelect('getCollectors', 'collector', 'apm_collectors_v1', 'กรุณาเลือก Collector', 'Collector');
      loadSelect('getPlantTypes', 'plantType', 'apm_plantTypes_v1', 'กรุณาเลือกชนิดพืช', 'ชนิดพืช');
    }

    // Initialize when page loads
    window.onload = function () {
      initializeApp();
      loadSelectData(); // เริ่มโหลด Select ทันที ขนานกับ GPS/LIFF
    };
  </script>
</body>
