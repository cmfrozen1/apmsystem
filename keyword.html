<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เลือก Keyword ที่ต้องการถาม</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <!-- Add jQuery for Select2 -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <!-- Add Select2 CSS and JS -->
  <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
  <style>
    /* Custom styles for Select2 to match Tailwind design */
    .select2-container--default .select2-selection--single {
      border: 1px solid #d1d5db;
      border-radius: 0.375rem;
      background-color: #ffffff;
      padding: 0.75rem 1rem;
      font-size: 1rem;
      line-height: 1.5rem;
      color: #374151;
    }
    .select2-container--default .select2-selection--single .select2-selection__rendered {
      color: #374151;
    }
    .select2-container--default .select2-selection--single .select2-selection__arrow {
      height: 100%;
      right: 0.75rem;
    }
    .select2-container--default .select2-selection--single:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.5);
    }
    .select2-container--default .select2-search--dropdown .select2-search__field {
      border: 1px solid #d1d5db;
      border-radius: 0.375rem;
      padding: 0.5rem;
      font-size: 1rem;
    }
    .select2-container--default .select2-results__option--highlighted[aria-selected] {
      background-color: #3b82f6;
      color: #ffffff;
    }
    .select2-container {
      width: 100% !important;
    }
  </style>
</head>
<body class="bg-gray-100 text-gray-900 min-h-screen flex flex-col items-center justify-center py-10">

  <!-- Card Container -->
  <div class="bg-white shadow-lg rounded-lg p-8 w-11/12 max-w-md">
    
    <!-- User Info Section -->
    <div class="flex flex-col items-center mb-6">
      <img id="userProfilePic" src="" alt="Profile Picture" class="w-20 h-20 rounded-full shadow-md mb-4 hidden">
      <p id="userName" class="text-lg font-medium text-gray-700">กำลังโหลดชื่อผู้ใช้...</p>
    </div>
    
    <h1 class="text-2xl font-semibold text-center mb-6 text-gray-800">เลือก Keyword</h1>
    
    <!-- Toggle Button for Search -->
    <button id="toggleSearch" class="w-full bg-indigo-600 text-white py-3 px-5 rounded-lg shadow-md hover:bg-indigo-700 focus:outline-none mb-6 transition">
      ค้นหาคำค้น
    </button>
    
    <!-- Search Dropdown -->
    <div id="searchContainer" class="relative mb-6 hidden">
      <select id="dropdown" class="block w-full"></select>
    </div>
    
    <!-- Send Button -->
    <button onclick="sendToChat()" class="w-full bg-blue-600 text-white py-3 px-5 rounded-lg shadow-md hover:bg-blue-700 focus:outline-none transition">
      ส่งค่า
    </button>
  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbxzhmCEXRd0sqYTAkqFA-X2HvV773QoGIdndRuEcDUqi2kXrqHkdjEMCAUUx-cTKyLg1g/exec'; // ใส่ URL ของ JSON API
    const LIFF_ID = '2007528760-v8N7EXG1'; // ใส่ LIFF ID ของคุณ

    // เริ่ม LIFF
    async function initializeLiff() {
      await liff.init({ liffId: LIFF_ID });
      if (!liff.isLoggedIn()) {
        liff.login();
      }
      displayUserProfile();
      fetchKeywords();
    }

    // แสดงชื่อและรูปโปรไฟล์ผู้ใช้
    async function displayUserProfile() {
      try {
        const profile = await liff.getProfile();
        const userNameElement = document.getElementById('userName');
        const userProfilePicElement = document.getElementById('userProfilePic');
        
        userNameElement.textContent = `สวัสดี, ${profile.displayName}`;
        userProfilePicElement.src = profile.pictureUrl;
        userProfilePicElement.classList.remove('hidden'); // แสดงรูปโปรไฟล์
      } catch (err) {
        console.error('Error fetching profile:', err);
        document.getElementById('userName').textContent = 'ไม่สามารถโหลดชื่อผู้ใช้ได้';
      }
    }

    // ดึงข้อมูลจาก API และใช้ Select2
    async function fetchKeywords() {
      try {
        const response = await fetch(API_URL);
        const keywords = await response.json();

        const $dropdown = $('#dropdown');
        keywords.forEach(item => {
          $dropdown.append(`<option value="${item.keyword}">${item.keyword}</option>`);
        });

        // Initialize Select2
        $dropdown.select2({
          placeholder: 'ค้นหา Keyword',
          allowClear: true,
          width: '100%',
          language: {
            noResults: () => 'ไม่พบผลลัพธ์'
          }
        });
      } catch (err) {
        console.error('Error fetching keywords:', err);
        alert('เกิดข้อผิดพลาดในการโหลด Keyword');
      }
    }

    // ฟังก์ชันที่ใช้เพื่อแสดง/ซ่อนช่องค้นหาตามการคลิกปุ่ม
    document.getElementById('toggleSearch').addEventListener('click', () => {
      const searchContainer = document.getElementById('searchContainer');
      const isHidden = searchContainer.classList.contains('hidden');
      searchContainer.classList.toggle('hidden', !isHidden);
    });

    // ส่งค่าเข้า LINE Chat
    async function sendToChat() {
      const $dropdown = $('#dropdown');
      const selectedValue = $dropdown.val();

      if (!selectedValue) {
        alert('กรุณาเลือก Keyword');
        return;
      }

      if (liff.isApiAvailable('shareTargetPicker')) {
        try {
          await liff.sendMessages([{
            type: 'text',
            text: `${selectedValue}`
          }]);
          liff.closeWindow(); // ปิด LIFF ทันที
        } catch (err) {
          console.error(err);
          alert('เกิดข้อผิดพลาดในการส่งข้อความ');
        }
      } else {
        alert('ไม่สามารถใช้งานฟังก์ชันส่งข้อความได้');
      }
    }

    initializeLiff();
  </script>
</body>
</html>
