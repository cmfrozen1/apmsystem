    <style type="text/css">
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Prompt', 'Sukhumvit Set', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            background: linear-gradient(155deg, #047857 0%, #059669 45%, #10b981 75%, #84cc16 100%);
            background-attachment: fixed;
            overflow: hidden;
            position: relative;
        }

        /* Decorative floating blobs */
        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.45;
            pointer-events: none;
            z-index: 0;
        }
        .blob-1 {
            width: 340px;
            height: 340px;
            background: #a7f3d0;
            top: -90px;
            left: -90px;
            animation: float 7s ease-in-out infinite;
        }
        .blob-2 {
            width: 280px;
            height: 280px;
            background: #d9f99d;
            bottom: -70px;
            right: -70px;
            animation: float 9s ease-in-out infinite reverse;
        }
        .blob-3 {
            width: 180px;
            height: 180px;
            background: #fde68a;
            top: 55%;
            right: 12%;
            animation: float 11s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-24px) scale(1.06); }
        }

        .card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-radius: 28px;
            padding: 2.6rem 2.2rem 2.4rem;
            text-align: center;
            box-shadow: 0 24px 60px rgba(2, 44, 34, 0.35), 0 4px 14px rgba(2, 44, 34, 0.12);
            animation: cardIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
        @keyframes cardIn {
            from { opacity: 0; transform: translateY(28px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .logo-wrap {
            width: 96px;
            height: 96px;
            margin: 0 auto 1.2rem;
            border-radius: 50%;
            background: linear-gradient(135deg, #ecfdf5, #d1fae5);
            border: 3px solid #a7f3d0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 10px 24px rgba(5, 150, 105, 0.25);
            animation: logoPulse 2.6s ease-in-out infinite;
        }
        .logo-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        @keyframes logoPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        h1 {
            font-size: 1.55rem;
            font-weight: 700;
            color: #064e3b;
            line-height: 1.4;
            margin-bottom: 0.35rem;
        }
        .subtitle {
            font-size: 0.85rem;
            color: #6b7280;
            font-weight: 400;
            margin-bottom: 1.6rem;
        }

        .spinner-wrap {
            display: flex;
            justify-content: center;
            margin-bottom: 1.1rem;
        }
        .spinner {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            border: 4px solid #d1fae5;
            border-top-color: #059669;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .status {
            font-size: 0.95rem;
            font-weight: 500;
            color: #065f46;
            min-height: 1.5em;
        }
        .status small {
            display: block;
            font-weight: 400;
            color: #9ca3af;
            font-size: 0.78rem;
            margin-top: 0.2rem;
        }

        .go-link {
            display: inline-block;
            margin-top: 0.9rem;
            font-size: 0.85rem;
            font-weight: 600;
            color: #059669;
            text-decoration: none;
            padding: 0.5rem 1.4rem;
            border: 2px solid #a7f3d0;
            border-radius: 999px;
            transition: all 0.25s ease;
        }
        .go-link:hover {
            background: #ecfdf5;
            border-color: #059669;
        }
        .hidden {
            display: none !important;
        }

        .badge-green {
            display: inline-block;
            margin-top: 1.3rem;
            padding: 0.3rem 0.9rem;
            font-size: 0.72rem;
            font-weight: 600;
            color: #065f46;
            background: #d1fae5;
            border-radius: 999px;
            letter-spacing: 0.3px;
        }
    </style>
</head>

<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <div class="card">
        <div class="logo-wrap">
            <img src="https://lh3.googleusercontent.com/a/ACg8ocJt_yMM3sBNowu7Y5BiDgl5qQ9R1vTL5vokSt_XWwuqA8_m7QU=s288-c-no"
                 alt="ระบบส่งงานส่งเสริมและการเกษตร">
        </div>
        <h1>ระบบส่งงานส่งเสริมและการเกษตร</h1>
        <p class="subtitle">บริษัทเชียงใหม่โฟรเซ่นฟูดส์ จำกัด (มหาชน)</p>
        <div class="spinner-wrap"><div class="spinner"></div></div>
        <p id="statusText" class="status">กำลังเชื่อมต่อกับระบบ...</p>
        <a id="goLink" href="#" class="go-link hidden">คลิกที่นี่เพื่อไปต่อ ➜</a>
        <div class="badge-green">🌱 ส่งเสริมการเกษตร</div>
    </div>

    <script src="https://static.line-scdn.net/liff/edge/versions/2.9.0/sdk.js" defer></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var target = new URL(window.location).searchParams.get('linkurl');

            function goToTarget() {
                if (!target) {
                    document.getElementById('statusText').innerHTML = 'ไม่พบลิงก์ปลายทาง<br><small>กรุณาเปิดระบบจากเมนู LINE อีกครั้ง</small>';
                    var link = document.getElementById('goLink');
                    link.href = '#';
                    link.classList.remove('hidden');
                    return;
                }
                document.getElementById('statusText').textContent = 'กำลังนำทางไปยังหน้างาน...';
                var link = document.getElementById('goLink');
                link.href = target;
                link.classList.remove('hidden');

                // Redirect to the target page (works inside LINE and in a normal browser)
                setTimeout(function () {
                    window.location.replace(target);
                }, 800);

                // Safety: close the LIFF window after a while (only meaningful inside LINE)
                setTimeout(function () {
                    try { if (window.liff && liff.closeWindow) liff.closeWindow(); } catch (e) { /* noop */ }
                }, 50000);
            }

            // Initialize LIFF, then decide where to go
            liff.init({ liffId: "2007528760-v8N7EXG1" })
                .then(function () {
                    goToTarget();
                })
                .catch(function (err) {
                    // Opened outside LINE or LIFF init failed — still redirect if we have a target
                    console.log("LIFF init failed (opened outside LINE?):", err);
                    goToTarget();
                });
        });
    </script>
</body>
