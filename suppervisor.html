<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>รายงานการกำกับดูแล (Supervisor)</title>
  <meta name="description" content="แบบฟอร์มรายงานการกำกับดูแล ชุปเปอร์ไวเซอร์">
  <link rel="icon" type="image/png" sizes="96x96" href="https://lh3.googleusercontent.com/a/ACg8ocJt_yMM3sBNowu7Y5BiDgl5qQ9R1vTL5vokSt_XWwuqA8_m7QU=s288-c-no">
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/css/tom-select.min.css" rel="stylesheet" />
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/js/tom-select.complete.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Prompt', sans-serif;
      background: linear-gradient(155deg, #f0fdf4 0%, #ecfdf5 45%, #d1fae5 100%);
      min-height: 100vh;
      padding-bottom: 3rem;
      background-attachment: fixed;
    }

    /* Header */
    .app-header {
      background: linear-gradient(120deg, #065f46, #059669 55%, #10b981);
      color: #fff;
      padding: 1.3rem 1.2rem;
      display: flex;
      align-items: center;
      gap: 0.9rem;
      box-shadow: 0 8px 24px rgba(5, 150, 105, 0.28);
      position: sticky;
      top: 0;
      z-index: 500;
    }
    .avatar {
      width: 48px; height: 48px;
      border-radius: 50%;
      background: #d1fae5;
      border: 2px solid rgba(255,255,255,0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      font-weight: 700;
      color: #047857;
      overflow: hidden;
      flex-shrink: 0;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .avatar.no-photo img { display: none; }
    .app-header .titles { flex: 1; min-width: 0; }
    .app-header .titles h1 { font-size: 1.05rem; font-weight: 700; line-height: 1.35; }
    .app-header .titles p { font-size: 0.78rem; color: #d1fae5; }
    .leaf-badge {
      width: 40px; height: 40px;
      border-radius: 12px;
      background: rgba(255,255,255,0.16);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      flex-shrink: 0;
    }

    .card {
      max-width: 540px;
      margin: 1.2rem auto 0;
      background: #fff;
      border-radius: 22px;
      box-shadow: 0 18px 44px rgba(2, 44, 34, 0.14);
      padding: 1.6rem 1.5rem 1.8rem;
      position: relative;
      border: 1px solid #eef2ef;
    }

    /* GPS checking / error screen */
    .gps-checking {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 3rem 1.2rem;
      min-height: 420px;
    }
    .gps-icon-wrap {
      width: 96px; height: 96px;
      border-radius: 50%;
      background: linear-gradient(135deg, #d1fae5, #a7f3d0);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.6rem;
      box-shadow: 0 12px 30px rgba(5, 150, 105, 0.25);
      animation: gpsPulse 2.2s ease-in-out infinite;
    }
    .gps-icon-wrap i { font-size: 2.6rem; color: #047857; }
    @keyframes gpsPulse {
      0%, 100% { transform: scale(1); box-shadow: 0 12px 30px rgba(5, 150, 105, 0.25); }
      50% { transform: scale(1.06); box-shadow: 0 14px 38px rgba(5, 150, 105, 0.4); }
    }
    .gps-icon-wrap.error {
      background: linear-gradient(135deg, #fee2e2, #fecaca);
      animation: none;
    }
    .gps-icon-wrap.error i { color: #dc2626; }
    .gps-checking h3 { font-size: 1.3rem; font-weight: 700; color: #064e3b; margin-bottom: 0.6rem; }
    .gps-checking p { color: #6b7280; font-size: 0.9rem; margin-bottom: 1.8rem; }
    .spinner {
      width: 42px; height: 42px;
      border: 4px solid #d1fae5;
      border-top: 4px solid #059669;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .retry-btn {
      padding: 0.8rem 2rem;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      font-family: 'Prompt', sans-serif;
      font-weight: 600;
      font-size: 0.95rem;
      color: #fff;
      background: linear-gradient(120deg, #059669, #10b981);
      box-shadow: 0 8px 20px rgba(5, 150, 105, 0.32);
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.25s ease;
    }
    .retry-btn:hover { transform: translateY(-2px); }
    .hidden { display: none !important; }

    .section-head {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      font-weight: 600;
      color: #065f46;
      margin: 1.3rem 0 0.7rem;
      padding-bottom: 0.5rem;
      border-bottom: 2px solid #f0fdf4;
    }
    .section-head:first-of-type { margin-top: 0; }
    .section-head .icon {
      width: 30px; height: 30px;
      border-radius: 9px;
      background: #d1fae5;
      color: #047857;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
    }

    .field { margin-bottom: 0.9rem; }
    .field label {
      display: block;
      font-size: 0.82rem;
      font-weight: 500;
      color: #4b5563;
      margin-bottom: 0.35rem;
    }
    .field label .req { color: #dc2626; }
    input[type="text"], input[type="date"], input[type="file"], textarea {
      width: 100%;
      padding: 0.72rem 0.9rem;
      border: 1.5px solid #d1d5db;
      border-radius: 12px;
      outline: none;
      font-family: 'Prompt', sans-serif;
      font-size: 0.9rem;
      background: #fff;
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
      color: #1f2937;
    }
    input:focus, textarea:focus {
      border-color: #10b981;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.18);
    }
    input[readonly] { background: #f8fafc; color: #6b7280; }
    textarea { min-height: 96px; resize: vertical; }
    input[type="file"] { padding: 0.5rem 0.9rem; }

    .file-box {
      border: 2px dashed #a7f3d0;
      border-radius: 14px;
      padding: 1.1rem;
      text-align: center;
      color: #047857;
      font-size: 0.85rem;
      background: #f0fdf4;
      cursor: pointer;
      transition: all 0.25s ease;
    }
    .file-box:hover { border-color: #059669; background: #ecfdf5; }
    .file-box i { font-size: 1.4rem; display: block; margin-bottom: 0.3rem; }

    .image-preview { margin-top: 0.8rem; }
    .image-preview img {
      width: 100%;
      max-height: 260px;
      object-fit: cover;
      border-radius: 14px;
      border: 2px solid #d1fae5;
      box-shadow: 0 8px 20px rgba(2, 44, 34, 0.12);
    }
    .map-container iframe { border-radius: 14px; border: 2px solid #d1fae5; }
    .coords-note {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.75rem;
      color: #047857;
      background: #f0fdf4;
      padding: 0.45rem 0.8rem;
      border-radius: 10px;
      margin-top: 0.5rem;
      word-break: break-all;
    }
    .coords-note i { flex-shrink: 0; }

    .submit-btn {
      width: 100%;
      margin-top: 1.4rem;
      padding: 0.95rem 1rem;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      font-family: 'Prompt', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      color: #fff;
      background: linear-gradient(120deg, #059669, #10b981);
      box-shadow: 0 10px 26px rgba(5, 150, 105, 0.35);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.55rem;
      transition: all 0.25s ease;
    }
    .submit-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 14px 32px rgba(5, 150, 105, 0.45); }
    .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    /* Tom Select green styling */
    .ts-wrapper { width: 100% !important; }
    .ts-control {
      border: 1.5px solid #d1d5db !important;
      border-radius: 12px !important;
      background-color: #ffffff !important;
      padding: 0.6rem 1rem !important;
      font-size: 0.9rem !important;
      color: #374151 !important;
      min-height: 44px !important;
      font-family: 'Prompt', sans-serif !important;
      cursor: pointer;
    }
    .ts-wrapper.focus .ts-control {
      border-color: #10b981 !important;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.18) !important;
    }
    .ts-dropdown {
      border-radius: 12px !important;
      border: 1.5px solid #d1d5db !important;
      font-family: 'Prompt', sans-serif !important;
      font-size: 0.9rem !important;
    }
    .ts-dropdown .option { font-family: 'Prompt', sans-serif !important; padding: 0.5rem 1rem; }
    .ts-dropdown .option.active { background-color: #059669 !important; color: #fff !important; }

    /* Loading overlay */
    .loading-overlay {
      display: none;
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(4px);
      border-radius: 22px;
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .loader {
      width: 50px; height: 50px;
      border: 5px solid #d1fae5;
      border-top: 5px solid #059669;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    .footnote {
      text-align: center;
      font-size: 0.75rem;
      color: #9ca3af;
      margin-top: 1.4rem;
    }

    @media (max-width: 480px) {
      .card { margin: 0.9rem 0.8rem 0; padding: 1.3rem 1.1rem 1.5rem; }
      .app-header { padding: 1rem 0.9rem; }
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="app-header">
    <div class="avatar" id="avatarBox"><img id="profileImage" src="" alt="Profile"><i class="fas fa-user-shield"></i></div>
    <div class="titles">
      <h1>รายงานการกำกับดูแล</h1>
      <p id="displayName">กำลังโหลด...</p>
    </div>
    <div class="leaf-badge"><i class="fas fa-leaf"></i></div>
  </header>

  <div class="card">
    <div class="loading-overlay" id="loadingOverlay">
      <div class="loader"></div>
    </div>

    <!-- GPS Checking Screen -->
    <div id="gpsCheckingScreen" class="gps-checking">
      <div class="gps-icon-wrap" id="gpsIcon"><i class="fas fa-map-marker-alt"></i></div>
      <h3 id="gpsTitle">กำลังตรวจสอบ GPS</h3>
      <p id="gpsDesc">กรุณารอสักครู่ขณะที่เราตรวจสอบตำแหน่งของคุณ...</p>
      <div class="spinner" id="gpsSpinner"></div>
      <button class="retry-btn hidden" id="gpsRetry" onclick="startGpsCheck()"><i class="fas fa-sync-alt"></i> ลองอีกครั้ง</button>
    </div>

    <!-- Main Form (Hidden until GPS ready) -->
    <form id="dataForm" class="hidden">
      <div class="section-head">
        <div class="icon"><i class="fas fa-calendar-day"></i></div> วันที่ปฏิบัติงาน
      </div>
      <div class="field">
        <input type="date" name="date" id="date" required>
      </div>

      <div class="section-head">
        <div class="icon"><i class="fas fa-user-tie"></i></div> ข้อมูลผู้ส่งงาน
      </div>
      <div class="field">
        <label>ชื่อชุปเปอร์ไวเซอร์ <span class="req">*</span></label>
        <select name="firstName" id="firstName" required>
          <option value="">กรุณาเลือกชื่อ</option>
        </select>
      </div>
      <div class="field">
        <label>เขต <span class="req">*</span></label>
        <select name="district" id="district" required>
          <option value="">กรุณาเลือกเขต</option>
        </select>
      </div>

      <div class="section-head">
        <div class="icon"><i class="fas fa-map-marked-alt"></i></div> ข้อมูลพื้นที่ (อัตโนมัติ)
      </div>
      <div class="field">
        <label>หมู่บ้าน</label>
        <input type="text" name="village" id="village" readonly>
      </div>
      <div class="field">
        <label>ตำบล</label>
        <input type="text" name="subDistrict" id="subDistrict" readonly>
      </div>

      <div class="section-head">
        <div class="icon"><i class="fas fa-clipboard-list"></i></div> รายละเอียดปฏิบัติงาน
      </div>
      <div class="field">
        <textarea name="details" required placeholder="ระบุรายละเอียดการปฏิบัติงาน"></textarea>
      </div>

      <div class="section-head">
        <div class="icon"><i class="fas fa-map-pin"></i></div> พิกัด
      </div>
      <div class="field">
        <div class="map-container" id="mapContainer"></div>
        <div class="coords-note hidden" id="coordsNote"><i class="fas fa-crosshairs"></i><span id="coordsText"></span></div>
      </div>

      <div class="section-head">
        <div class="icon"><i class="fas fa-camera"></i></div> รูปภาพ
      </div>
      <div class="field">
        <label class="file-box" for="imageFile">
          <i class="fas fa-cloud-upload-alt"></i>
          เลือกรูปภาพ (จำเป็น)
        </label>
        <input type="file" name="imageFile" id="imageFile" accept="image/*" class="hidden" required>
        <div class="image-preview" id="imagePreview"></div>
      </div>

      <button type="submit" id="sub" class="submit-btn"><i class="fas fa-paper-plane"></i> บันทึกการกำกับดูแล</button>
      <p class="footnote"><i class="fas fa-leaf"></i> ระบบส่งเสริมการเกษตร • บริษัทเชียงใหม่โฟรเซ่นฟูดส์ จำกัด (มหาชน)</p>
    </form>
  </div>

  <script>
    let currentCoordinates = '';
    let userId = '';
    let locationReady = false;

    // Initialize LIFF
    async function initializeLiff() {
      try {
        await liff.init({ liffId: '2007528760-v8N7EXG1' }); // Replace with your LIFF ID
        if (liff.isLoggedIn()) {
          const profile = await liff.getProfile();
          userId = profile.userId;
          document.getElementById('displayName').textContent = profile.displayName;
          const avatarBox = document.getElementById('avatarBox');
          if (profile.pictureUrl) {
            document.getElementById('profileImage').src = profile.pictureUrl;
            avatarBox.classList.remove('no-photo');
          } else {
            avatarBox.classList.add('no-photo');
          }
        } else {
          liff.login();
        }
      } catch (error) {
        document.getElementById('displayName').textContent = 'ยินดีต้อนรับ';
        document.getElementById('avatarBox').classList.add('no-photo');
        Swal.fire({
          icon: 'error',
          title: 'LIFF Initialization Failed',
          text: error.message,
          confirmButtonColor: '#059669'
        });
      }
    }

    // GPS with timeout
    function getLocation() {
      return new Promise((resolve, reject) => {
        if (!navigator.geolocation) {
          reject(new Error('เบราว์เซอร์ของคุณไม่สนับสนุนการรับพิกัด GPS'));
          return;
        }
        const timeoutId = setTimeout(() => reject(new Error('การตรวจสอบตำแหน่งหมดเวลา')), 15000);
        navigator.geolocation.getCurrentPosition(
          (position) => { clearTimeout(timeoutId); resolve(position); },
          (error) => {
            clearTimeout(timeoutId);
            let msg = '';
            switch (error.code) {
              case error.PERMISSION_DENIED: msg = 'ไม่อนุญาตให้ LINE เข้าถึงตำแหน่ง'; break;
              case error.POSITION_UNAVAILABLE: msg = 'ไม่สามารถระบุตำแหน่งได้'; break;
              case error.TIMEOUT: msg = 'การตรวจสอบตำแหน่งหมดเวลา'; break;
              default: msg = 'เกิดข้อผิดพลาดในการรับตำแหน่ง'; break;
            }
            reject(new Error(msg));
          },
          { enableHighAccuracy: true, timeout: 13000, maximumAge: 30000 }
        );
      });
    }

    function showPosition(position) {
      currentCoordinates = position.coords.latitude + ", " + position.coords.longitude;
      const mapHtml = `<iframe width="100%" height="300" frameborder="0" scrolling="no" marginheight="0" marginwidth="0" src="https://maps.google.com/maps?q=${currentCoordinates}&t=&z=15&ie=UTF8&iwloc=&output=embed"></iframe>`;
      document.getElementById('mapContainer').innerHTML = mapHtml;
      const note = document.getElementById('coordsNote');
      note.classList.remove('hidden');
      document.getElementById('coordsText').textContent = 'พิกัด: ' + currentCoordinates;
    }

    // GPS flow: show form only when coordinates are ready (prevents NaN submission)
    function startGpsCheck() {
      locationReady = false;
      const screen = document.getElementById('gpsCheckingScreen');
      document.getElementById('gpsIcon').className = 'gps-icon-wrap';
      document.getElementById('gpsIcon').innerHTML = '<i class="fas fa-map-marker-alt"></i>';
      document.getElementById('gpsTitle').textContent = 'กำลังตรวจสอบ GPS';
      document.getElementById('gpsDesc').textContent = 'กรุณารอสักครู่ขณะที่เราตรวจสอบตำแหน่งของคุณ...';
      document.getElementById('gpsSpinner').classList.remove('hidden');
      document.getElementById('gpsRetry').classList.add('hidden');
      screen.style.display = 'flex';
      document.getElementById('dataForm').classList.add('hidden');

      getLocation()
        .then((position) => {
          showPosition(position);
          locationReady = true;
          screen.style.display = 'none';
          document.getElementById('dataForm').classList.remove('hidden');
        })
        .catch((err) => {
          console.error('GPS error:', err.message);
          document.getElementById('gpsIcon').className = 'gps-icon-wrap error';
          document.getElementById('gpsIcon').innerHTML = '<i class="fas fa-exclamation-triangle"></i>';
          document.getElementById('gpsTitle').textContent = 'ไม่สามารถรับตำแหน่งได้';
          document.getElementById('gpsDesc').textContent = err.message + ' กรุณาเปิด GPS และอนุญาตสิทธิ์ตำแหน่ง แล้วลองใหม่อีกครั้ง';
          document.getElementById('gpsSpinner').classList.add('hidden');
          document.getElementById('gpsRetry').classList.remove('hidden');
        });
    }

    document.getElementById('imageFile').addEventListener('change', function (event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function (e) {
          document.getElementById('imagePreview').innerHTML = `<img src="${e.target.result}" alt="Image Preview">`;
        };
        reader.readAsDataURL(file);
      }
    });

    document.getElementById('dataForm').addEventListener('submit', async function (event) {
      event.preventDefault();

      const fileInput = document.getElementById('imageFile').files[0];
      if (!fileInput) {
        Swal.fire({ icon: 'warning', title: 'กรุณาเลือกรูปภาพ', text: 'ต้องแนบรูปภาพก่อนบันทึกข้อมูล', confirmButtonColor: '#059669' });
        return;
      }
      if (!locationReady || !currentCoordinates) {
        Swal.fire({ icon: 'warning', title: 'ยังไม่มีพิกัด GPS', text: 'กรุณารอให้ระบบตรวจสอบตำแหน่งสำเร็จก่อนบันทึกข้อมูล', confirmButtonColor: '#059669' });
        return;
      }

      const loadingOverlay = document.getElementById('loadingOverlay');
      loadingOverlay.style.display = 'flex';

      const submitButton = document.getElementById('sub');
      submitButton.disabled = true;
      submitButton.textContent = "กำลังบันทึก...";

      const formData = new FormData(this);
      const submitDate = new Date().toLocaleDateString();
      const submitTime = new Date().toLocaleTimeString();
      const location = `https://maps.google.com/maps?q=${currentCoordinates}`;

      const reader = new FileReader();
      reader.onload = async function (event) {
        const base64 = event.target.result.split(',')[1];
        const data = {
          date: formData.get('date'),
          firstName: formData.get('firstName'),
          district: formData.get('district'),
          village: formData.get('village'),
          subDistrict: formData.get('subDistrict'),
          details: formData.get('details'),
          coordinates: currentCoordinates,
          location: location,
          base64: base64,
          type: fileInput.type,
          name: fileInput.name,
          submitDate: submitDate,
          submitTime: submitTime,
          userId: userId
        };

        try {
          const response = await fetch('https://script.google.com/macros/s/AKfycbyE8tvOVYAAR6WOiCVDEb2Fp1Yq3ebTAri9ZQYonpduMjQCFzod8xi0glBVXc6A6_qOeA/exec', {
            method: "POST",
            body: JSON.stringify(data)
          });
          const result = await response.json();

          if (result.status !== "success") {
            throw new Error(result.message || "Failed to upload data and image");
          }

          const fileLink = result.fileLink;

          const flexMessage = {
            type: "flex",
            altText: "รายงานการทำงานSupervisor",
            contents: {
              type: "bubble",
              body: {
                type: "box",
                layout: "vertical",
                contents: [
                  {
                    type: "text",
                    text: "รายงานการทำงานSupervisor",
                    weight: "bold",
                    size: "md",
                    wrap: true
                  },
                  {
                    type: "box",
                    layout: "vertical",
                    margin: "lg",
                    spacing: "sm",
                    contents: [
                      { type: "text", text: `วันที่: ${data.date}`, wrap: true },
                      { type: "text", text: `ชื่อชุปเปอร์ไวเซอร์: ${data.firstName}`, wrap: true },
                      { type: "text", text: `เขต: ${data.district}`, wrap: true },
                      { type: "text", text: `หมู่บ้าน: ${data.village}`, wrap: true },
                      { type: "text", text: `ตำบล: ${data.subDistrict}`, wrap: true },
                      { type: "text", text: `รายละเอียดปฏิบัติงาน: ${data.details}`, wrap: true },
                      { type: "text", text: `พิกัด: ${data.coordinates}`, wrap: true },
                      { type: "text", text: `ส่งเมื่อ: ${data.submitDate} ${data.submitTime}`, wrap: true }
                    ]
                  }
                ]
              }
            }
          };

          const imageMessage = {
            type: "image",
            originalContentUrl: fileLink,
            previewImageUrl: fileLink
          };

          await liff.sendMessages([
            flexMessage,
            imageMessage,
            {
              type: "location",
              title: "สถานที่ปฏิบัติงาน",
              address: data.location,
              latitude: parseFloat(currentCoordinates.split(',')[0]),
              longitude: parseFloat(currentCoordinates.split(',')[1])
            }
          ]);

          loadingOverlay.style.display = 'none';
          submitButton.textContent = "บันทึกการกำกับดูแล";
          submitButton.disabled = false;
          document.getElementById('dataForm').reset();
          document.getElementById('imagePreview').innerHTML = '';

          Swal.fire({
            icon: 'success',
            title: 'บันทึกและส่งสำเร็จ!',
            text: 'ข้อมูลการกำกับดูแลถูกบันทึกและส่งไปยัง LINE Chat เรียบร้อยแล้ว',
            timer: 2000,
            showConfirmButton: false
          });

          // ปิดหน้าต่างหลังจากแสดงข้อความสำเร็จแล้ว (ไม่ปิดทันทีจนมองไม่เห็น Toast)
          setTimeout(function () {
            try { liff.closeWindow(); } catch (e) { /* noop */ }
          }, 1600);
        } catch (error) {
          loadingOverlay.style.display = 'none';
          Swal.fire({
            icon: 'error',
            title: 'เกิดข้อผิดพลาด',
            text: 'ไม่สามารถบันทึกหรือส่งข้อมูลได้: ' + error.message,
            confirmButtonColor: '#059669'
          });
          submitButton.textContent = "บันทึกการกำกับดูแล";
          submitButton.disabled = false;
        }
      };
      reader.readAsDataURL(fileInput);
    });

    function fetchPromoterNames() {
      fetch('https://script.google.com/macros/s/AKfycbyE8tvOVYAAR6WOiCVDEb2Fp1Yq3ebTAri9ZQYonpduMjQCFzod8xi0glBVXc6A6_qOeA/exec?action=getPromoterNames')
        .then(response => response.json())
        .then(data => {
          if (data.error) {
            Swal.fire({ icon: 'error', title: 'ข้อผิดพลาด', text: 'ไม่สามารถโหลดชื่อได้: ' + data.error, confirmButtonColor: '#059669' });
            return;
          }
          const selectElement = document.getElementById('firstName');
          data.forEach(name => { const o = document.createElement('option'); o.value = name; o.text = name; selectElement.appendChild(o); });
          new TomSelect('#firstName', { placeholder: 'กรุณาเลือกชื่อ', allowEmptyOption: true });
        })
        .catch(error => {
          Swal.fire({ icon: 'error', title: 'ข้อผิดพลาด', text: 'เกิดข้อผิดพลาดในการเชื่อมต่อ: ' + error.message, confirmButtonColor: '#059669' });
        });
    }

    function fetchDistricts() {
      fetch('https://script.google.com/macros/s/AKfycbyE8tvOVYAAR6WOiCVDEb2Fp1Yq3ebTAri9ZQYonpduMjQCFzod8xi0glBVXc6A6_qOeA/exec?action=getDistricts')
        .then(response => response.json())
        .then(data => {
          if (data.error) {
            Swal.fire({ icon: 'error', title: 'ข้อผิดพลาด', text: 'ไม่สามารถโหลดเขตได้: ' + data.error, confirmButtonColor: '#059669' });
            return;
          }
          const selectElement = document.getElementById('district');
          data.forEach(district => { const o = document.createElement('option'); o.value = district; o.text = district; selectElement.appendChild(o); });
          const tsDistrict = new TomSelect('#district', { placeholder: 'กรุณาเลือกเขต', allowEmptyOption: true });

          tsDistrict.on('change', function (value) {
            if (value) {
              fetchAutoData(value);
            } else {
              document.getElementById('village').value = '';
              document.getElementById('subDistrict').value = '';
            }
          });
        })
        .catch(error => {
          Swal.fire({ icon: 'error', title: 'ข้อผิดพลาด', text: 'เกิดข้อผิดพลาดในการเชื่อมต่อ: ' + error.message, confirmButtonColor: '#059669' });
        });
    }

    function fetchAutoData(district) {
      fetch(`https://script.google.com/macros/s/AKfycbyE8tvOVYAAR6WOiCVDEb2Fp1Yq3ebTAri9ZQYonpduMjQCFzod8xi0glBVXc6A6_qOeA/exec?action=getAutoData&district=${encodeURIComponent(district)}`)
        .then(response => response.json())
        .then(data => {
          if (data.error) {
            Swal.fire({ icon: 'error', title: 'ข้อผิดพลาด', text: 'ไม่สามารถโหลดข้อมูลได้: ' + data.error, confirmButtonColor: '#059669' });
            return;
          }
          document.getElementById('village').value = data.village || '';
          document.getElementById('subDistrict').value = data.subDistrict || '';
        })
        .catch(error => {
          Swal.fire({ icon: 'error', title: 'ข้อผิดพลาด', text: 'เกิดข้อผิดพลาดในการเชื่อมต่อ: ' + error.message, confirmButtonColor: '#059669' });
        });
    }

    window.onload = function () {
      initializeLiff().then(() => {
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('date').value = today;
        fetchPromoterNames();
        fetchDistricts();
        startGpsCheck();
      });
    };
  </script>
</body>
</html>
